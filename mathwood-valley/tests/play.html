<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mathwood Valley: the player, horse, dog and lasso</title>
<script src="../oops.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #e8e0d0; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 10px; left: 12px; z-index: 5; font: 12px/1.5 ui-monospace, monospace; text-shadow: 0 1px 3px #000; pointer-events: none; white-space: pre; }
  #go { position: fixed; top: 10px; right: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px; max-width: 46vw; justify-content: flex-end; }
  #go button, #touch button { font: 600 11px ui-monospace, monospace; background: rgba(40, 28, 16, .8); color: #f0d9a8; border: 1px solid #7a5a3a; border-radius: 4px; padding: 5px 8px; cursor: pointer; }
  #go .gap { flex-basis: 100%; height: 0; }
  #rule { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5; background: rgba(243, 230, 200, .92); color: #3b2a1e;
          font: 700 18px Georgia, serif; padding: 6px 16px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.35); pointer-events: none; }
  #keys { position: fixed; left: 12px; bottom: 10px; z-index: 5; font: 12px/1.5 ui-monospace, monospace; text-shadow: 0 1px 3px #000; pointer-events: none; opacity: .85; }
  #touch { position: fixed; right: 14px; bottom: 18px; z-index: 6; display: none; gap: 12px; }
  #touch button { width: 68px; height: 68px; border-radius: 50%; font-size: 13px; }
  body.touch #touch { display: flex; }
  body.shot #go, body.shot #keys { display: none; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; background: #1c140c; font: 600 15px ui-monospace, monospace; color: #f0d9a8; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<div id="load">Loading…</div>
<div id="hud"></div>
<div id="rule">Rope the 6-herd</div>
<div id="go"></div>
<div id="keys">WASD / arrows: move · Shift: run, gallop · drag: look · wheel: zoom · click a steer: lasso · E: on / off the horse · H: call the horse</div>
<div id="touch"><button id="tE">On / off</button><button id="tH">Horse</button></div>
<script type="module">
// THE PLAYER IN THE VALLEY: src/player.js (on foot, the horse, the lasso), src/camera.js, src/input.js and src/dog.js in the
// real world, standing in the town square. Test cattle graze in the pasture (and one near town with "cow here"): a number
// over each; the 6-herd ones are right picks. Click one to throw.
//   ?q=potato|normal|gaming   the world's tier;  ?look=summer
//   ?saddle=plain|tooled|silver  start owning a saddle (the buttons give one later);  ?horse=white
//   ?dog=shiba|husky|none  ?name=Biscuit   the dog
//   ?at=pasture|trail|corral|square   start there;  ?shot: no buttons (for pictures)
//   ?outfit=adventurer_f&palette=prairie   the rider's look (as rider.look in save.js)
//   ?noclips   the people without the Blender clips (to see the stand-ins: hand-posed sitting, the wave for a swing)
// For rigs: window.PT = { ready, W, P, D, I, camera, renderer, rider, cows, fps(s), frameMs(n), giveSaddle(kind),
//   goto(place), cowHere(n), screenOf(object3D or cow) -> { x, y, on } (client pixels), said: the messages, errors,
//   timeScale: 1 (0.25: everything at a quarter speed, to catch each part of a throw in a picture), step(dt): one frame
//   moved on by dt seconds and drawn (between the page's own frames) }
import * as THREE from 'three';
import { makeWorld } from '../src/world.js';
import { loadFolk } from '../src/actors/folk.js';
import { loadAnimals, makeAnimal, COATS } from '../src/actors/animals.js';
import { makeInput } from '../src/input.js';
import { makePlayer } from '../src/player.js';
import { makeDog } from '../src/dog.js';

const Q = new URLSearchParams(location.search);
if (Q.has('shot')) document.body.classList.add('shot');
const $ = (id) => document.getElementById(id);
const PT = window.PT = { ready: false, errors: [], said: [], timeScale: 1 };
addEventListener('error', (e) => PT.errors.push(String(e.message)));
const renderer = new THREE.WebGLRenderer({ antialias: Q.get('q') !== 'potato' });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 5000);
const t0 = performance.now();
const say = (text) => { PT.said.push({ text, t: +(performance.now() / 1000).toFixed(2) }); toast(text); };

const [W, folk, animals] = await Promise.all([
  makeWorld({ renderer, camera, quality: Q.get('q') || undefined, look: Q.get('look') || 'green', onProgress: (p, text) => { $('load').textContent = `${text}… ${Math.round(p * 100)}%`; } }),
  loadFolk(),
  loadAnimals(undefined, { kinds: ['horse', 'cow', Q.get('dog') === 'husky' ? 'husky' : 'shiba'] }),
]);
if (Q.has('noclips')) for (const body of Object.keys(folk.clips)) folk.clips[body] = folk.clips[body].filter((c) => !/^(Lasso_|Ride)/.test(c.name));
$('load').remove();

// the rider, as save.js keeps one (only what the player reads)
const rider = PT.rider = { name: 'Test', look: { outfit: Q.get('outfit') || 'farmer_m', palette: Q.get('palette') || 'drifter' },
  owned: { saddle: Q.get('saddle') || null, horse: Q.get('horse') || 'bay', dog: Q.get('dog') === 'none' ? null : { kind: Q.get('dog') || 'shiba', name: Q.get('name') || 'Biscuit' } } };
const I = makeInput(renderer.domElement, { camera });
const P = makePlayer({ W, folk, animals, rider, input: I, camera, say });
const D = rider.owned.dog ? makeDog({ W, scene: W.scene, animals, kind: rider.owned.dog.kind, name: rider.owned.dog.name, follow: () => P.position }) : null;
$('tE').onclick = () => I.press('KeyE'); $('tH').onclick = () => I.press('KeyH');

// ── A NOTE ON SCREEN (the game has its own; this page shows the player's messages here) ─────────────────────────
let toastEl = null, toastT = 0;
function toast(text) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.style.cssText = 'position:fixed;left:50%;bottom:13%;transform:translateX(-50%);z-index:30;background:rgba(30,20,12,.85);color:#f3e6c8;font:600 17px Georgia,serif;padding:9px 18px;border-radius:7px;pointer-events:none;transition:opacity .3s'; document.body.appendChild(toastEl); }
  toastEl.textContent = text; toastEl.style.opacity = '1'; clearTimeout(toastT); toastT = setTimeout(() => { toastEl.style.opacity = '0'; }, 2600);
}

// ── TEST CATTLE: a number over each; the 6-herd's are right ──────────────────────────────────────────────────────
function numberSprite(n) {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 96; const c = cv.getContext('2d');
  c.fillStyle = 'rgba(243,230,200,0.92)'; c.beginPath(); c.roundRect(4, 4, 120, 88, 20); c.fill();
  c.fillStyle = '#3b2a1e'; c.font = '700 64px Georgia, serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(n), 64, 52);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false, toneMapped: false, fog: false })); s.scale.set(0.8, 0.6, 1); s.center.set(0.5, 0); return s;
}
const cows = PT.cows = [];
function addCow(n, x, z, rot = Math.random() * 6.28) {
  const a = makeAnimal(animals, 'cow', { tint: COATS[cows.length % COATS.length] });
  a.root.position.set(x, W.heightAt(x, z), z); a.root.rotation.y = rot; W.scene.add(a.root);
  const label = numberSprite(n); W.scene.add(label);
  const cow = { a, n, good: n % 6 === 0, label, state: 'graze', t: Math.random() * 4, home: { x, z }, busy: false };
  cow.root = a.root;
  I.addTarget(a.root, cow); cows.push(cow); return cow;
}
const PA = W.places.pasture;
[[12, -6, 4], [27, 5, -3], [18, 0, 9], [30, -10, -6], [16, 9, 6]].forEach(([n, dx, dz]) => addCow(n, PA.x + dx, PA.z + dz));
PT.cowHere = (n = 24) => { const s = Math.sin(P.heading), c = Math.cos(P.heading), x = P.position.x + s * 9, z = P.position.z + c * 9; return addCow(n, x, z, P.heading + Math.PI).n; };
// what a cow does: grazes, ambles a few steps now and then; once roped right, it is led, then walks off to the corral
function cowStep(cow, dt) {
  const a = cow.a, r = a.root;
  if (cow.state === 'held') { a.update(dt); return; }
  if (cow.state === 'corral') {
    const g = W.places.corral.gate, tgt = cow.leg === 0 ? g.out : cow.leg === 1 ? g.in : W.places.corral;
    const dx = tgt.x - r.position.x, dz = tgt.z - r.position.z, d = Math.hypot(dx, dz);
    if (d < 1) { cow.leg++; if (cow.leg > 2) { cow.state = 'penned'; a.play('Eating'); } }
    else { const h = Math.atan2(dx, dz); r.rotation.y += Math.atan2(Math.sin(h - r.rotation.y), Math.cos(h - r.rotation.y)) * Math.min(1, 4 * dt);
      const v = 2.6, nx = r.position.x + Math.sin(r.rotation.y) * v * dt, nz = r.position.z + Math.cos(r.rotation.y) * v * dt;
      r.position.set(nx, W.heightAt(nx, nz), nz); a.play('Gallop', { speed: v / a.stride.Gallop * 0.8 }); }
  } else if (cow.state === 'graze' && !cow.busy) {
    if ((cow.t -= dt) <= 0) { cow.walking = !cow.walking && Math.random() < 0.5; cow.t = 3 + Math.random() * 5; a.play(cow.walking ? 'Walk' : Math.random() < 0.6 ? 'Eating' : 'Idle'); if (cow.walking) r.rotation.y += (Math.random() - 0.5) * 2; }
    if (cow.walking) { const nx = r.position.x + Math.sin(r.rotation.y) * 0.33 * dt, nz = r.position.z + Math.cos(r.rotation.y) * 0.33 * dt; if (!W.blocked(nx, nz) && Math.hypot(nx - cow.home.x, nz - cow.home.z) < 8) r.position.set(nx, W.heightAt(nx, nz), nz); else r.rotation.y += 2 * dt; }
  }
  a.update(dt);
}
function throwAt(cow, good = cow.good) {
  if (!cow || cow.state !== 'graze' || cow.busy) return false;
  const ok = P.throwLasso(cow.a, { good,
    onLand: (ok) => { if (!ok) { say('Not me, partner'); cow.a.play('Idle_HitReact1', { once: true }); } },
    onCaught: (h) => { cow.state = 'held'; say(`Roped the ${cow.n}!`); h.target.play('Idle_HitReact2', { once: true }); cow.handle = h; },
    onMissed: () => { cow.busy = false; cow.a.play('Idle'); },
    onCancel: () => { cow.busy = false; },
  });
  if (ok) { cow.busy = true; cow.walking = false; cow.a.play('Idle', { fade: 0.3 }); }
  return ok;
}
// after the catch: the rope is slipped off once the lasso lets go (its hold), and the steer heads for the corral
setInterval(() => { for (const c of cows) if (c.state === 'held' && c.handle && !c.handle.held) { c.state = 'corral'; c.leg = 0; } }, 100);
I.onPick((p) => { if (p.hit && p.hit.data && cows.includes(p.hit.data)) throwAt(p.hit.data); });

// ── BUTTONS ─────────────────────────────────────────────────────────────────────────────────────────────────
PT.giveSaddle = (kind) => { rider.owned.saddle = kind || null; P.refreshOwned(); };
const goSpot = { square: () => W.places.spawn, trail: () => { const t = W.places.trail[20]; return { x: t[0], z: t[1], rot: Math.PI / 2 }; },
  pasture: () => ({ x: PA.x - 20, z: PA.z - 6, rot: 1.3 }), corral: () => { const g = W.places.corral.gate.out; return { x: g.x + 4, z: g.z, rot: -Math.PI / 2 }; } };
PT.goto = (name) => { const s = goSpot[name](); P.teleport(s.x, s.z, s.rot ?? 0); };
const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = (e) => { fn(); e.target.blur(); }; $('go').appendChild(b); return b; };
for (const k of ['plain', 'tooled', 'silver']) btn(k + ' saddle', () => PT.giveSaddle(k));
btn('no saddle', () => PT.giveSaddle(null));
btn('white horse', () => { rider.owned.horse = rider.owned.horse === 'white' ? 'bay' : 'white'; P.refreshOwned(); });
$('go').appendChild(Object.assign(document.createElement('div'), { className: 'gap' }));
for (const k of Object.keys(goSpot)) btn(k, () => PT.goto(k));
btn('cow here', () => PT.cowHere(24));
btn('throw right', () => throwAt(nearestCow(true), true));
btn('throw wrong', () => throwAt(nearestCow(false), false));
function nearestCow(good) { let best = null, bd = Infinity; for (const c of cows) { if (c.state !== 'graze' || c.good !== good) continue; const d = c.root.position.distanceTo(P.position); if (d < bd) { bd = d; best = c; } } return best; }
PT.throwAt = (n, good) => throwAt(cows.find((c) => c.n === n), good);
PT.nearestCow = nearestCow;

// ── WHERE THINGS ARE ON SCREEN (for the rig's clicks) ───────────────────────────────────────────────────────
PT.screenOf = (o) => {
  const obj = o.root || o, v = new THREE.Vector3(); obj.getWorldPosition(v); v.y += (o.a ? o.a.height * 0.6 : 0.8);
  v.project(camera); const r = renderer.domElement.getBoundingClientRect();
  return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height, on: v.z < 1 && Math.abs(v.x) < 1 && Math.abs(v.y) < 1 };
};

// ── THE START ───────────────────────────────────────────────────────────────────────────────────────────────
if (Q.get('at') && goSpot[Q.get('at')]) PT.goto(Q.get('at'));

// ── EACH FRAME ──────────────────────────────────────────────────────────────────────────────────────────────
let last = performance.now(), frames = 0, tFps = last, fpsNow = 0;
function step(dt) {
  P.update(dt); if (D) D.update(dt);
  for (const c of cows) { cowStep(c, dt); c.label.position.set(c.root.position.x, c.root.position.y + c.a.tall + 0.35, c.root.position.z); }
  W.update(dt); W.render();
}
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = (now - last) / 1000; last = now;
  step(dt * PT.timeScale);
  if (I.touch) document.body.classList.add('touch');
  frames++; if (now - tFps > 500) { fpsNow = frames * 1000 / (now - tFps); frames = 0; tFps = now;
    const s = P.state(), d = D ? D.state() : null;
    $('hud').textContent = `${W.tier} · ${fpsNow.toFixed(0)} fps · ${renderer.info.render.calls} draws · ${(renderer.info.render.triangles / 1e6).toFixed(2)} M tris\n`
      + `${s.mode} ${s.speed.toFixed(1)} m/s · ${s.clip}${s.layer ? ' + ' + s.layer : ''} · lasso ${s.lasso}${s.job ? ' (' + s.job + ')' : ''} · at ${s.x.toFixed(0)}, ${s.z.toFixed(0)}\n`
      + (s.horse ? `horse ${s.horse.mode} ${s.horse.gait} ${s.horse.speed.toFixed(1)} m/s · ${s.horse.dist.toFixed(1)} m away · saddle ${s.horse.saddle || 'none'}\n` : 'horse: loading\n')
      + (d ? `dog ${d.name}: ${d.gait} ${d.speed.toFixed(1)} m/s${d.sit > 0.5 ? ', sitting' : ''}` : 'no dog'); }
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
PT.fps = (seconds = 3) => new Promise((res) => { let n = 0; const a = performance.now(); const f = () => { n++; if (performance.now() - a < seconds * 1000) requestAnimationFrame(f); else res(n * 1000 / (performance.now() - a)); }; requestAnimationFrame(f); });
// a frame's real cost, not held to the screen's refresh: n frames drawn back to back, each waited for (a pixel read back)
PT.frameMs = (n = 60) => { const gl = renderer.getContext(), px = new Uint8Array(4); let worst = 0; const a = performance.now();
  for (let i = 0; i < n; i++) { const f0 = performance.now(); step(1 / 60); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); worst = Math.max(worst, performance.now() - f0); }
  last = performance.now(); return { avg: (performance.now() - a) / n, worst }; };
Object.assign(PT, { W, P, D, I, camera, renderer, step, loadMs: performance.now() - t0, ready: true });
</script>
</body>
</html>
