<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mathwood Valley: the target ring</title>
<script src="../oops.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #e8e0d0; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 10px; left: 12px; z-index: 5; font: 12px/1.5 ui-monospace, monospace; text-shadow: 0 1px 3px #000; pointer-events: none; white-space: pre; }
  #go { position: fixed; top: 10px; right: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px; max-width: 46vw; justify-content: flex-end; }
  #go button, #touch button { font: 600 11px ui-monospace, monospace; background: rgba(40, 28, 16, .8); color: #f0d9a8; border: 1px solid #7a5a3a; border-radius: 4px; padding: 5px 8px; cursor: pointer; }
  #go .gap { flex-basis: 100%; height: 0; }
  #rule { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5; background: rgba(243, 230, 200, .92); color: #3b2a1e;
          font: 700 18px Georgia, serif; padding: 6px 16px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.35); pointer-events: none; }
  #keys { position: fixed; left: 12px; bottom: 10px; z-index: 5; font: 12px/1.5 ui-monospace, monospace; text-shadow: 0 1px 3px #000; pointer-events: none; opacity: .85; }
  #touch { position: fixed; right: 14px; bottom: 18px; z-index: 6; display: none; gap: 12px; }
  #touch button { width: 68px; height: 68px; border-radius: 50%; font-size: 13px; }
  body.touch #touch { display: flex; }
  body.shot #go, body.shot #keys, body.shot #hud { display: none; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; background: #1c140c; font: 600 15px ui-monospace, monospace; color: #f0d9a8; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<div id="load">Loading…</div>
<div id="hud"></div>
<div id="rule">Rope the 6-herd</div>
<div id="go"></div>
<div id="keys">point at a steer: the green ring · click it (or F, or Space on foot): lasso the ringed one · WASD: move · drag: look · E: on / off the horse · H: call the horse</div>
<div id="touch"><button id="tF">Rope</button><button id="tE">On / off</button><button id="tH">Horse</button></div>
<script type="module">
// THE TARGET RING (src/targetring.js) in the real valley: the player at the pasture with a herd of ten cattle that carry
// numbers (the 6-herd's are right picks) and two bandits. Move the mouse: the steer under the pointer (or its number
// card), else the one nearest it, gets the green ring (with the pointer near none, the one nearest the middle of the
// screen, ahead and within 35 m), and its number card is lifted over the others with a green frame. A click on or near a
// steer (not a drag), F, or Space on foot throws the lasso at the ringed one. On a touch screen a tap ropes the one
// under or nearest the tap. The ring is pale and thinner while its target is out of the lasso's reach.
//   ?q=potato|normal|gaming   the world's tier;  ?saddle=plain|tooled|silver  own a saddle (call the horse with H)
//   ?bandits=0   no bandits (ten targets);  ?shot: no buttons or readout (for pictures)
// For rigs: window.PT = { ready, W, P, R, I, camera, renderer, targets, cows, bandits, errors, said, step(dt), frameMs(n),
//   ringCost: { avg, worst, n } (ms R.update took, since PT.ringCost.reset()), place(target, ahead, side) (metres in front
//   of the player and to the right of the camera), facePlayer(target), shade() -> the player and two cows put in a tree's
//   shadow, throwAt(target), mount() (on the horse; resolves when seated) }
import * as THREE from 'three';
import { makeWorld } from '../src/world.js';
import { loadFolk, makePerson } from '../src/actors/folk.js';
import { loadAnimals, makeAnimal, COATS } from '../src/actors/animals.js';
import { makeInput } from '../src/input.js';
import { makePlayer, MOVE } from '../src/player.js';
import { makeTargetRing } from '../src/targetring.js';

const Q = new URLSearchParams(location.search);
if (Q.has('shot')) document.body.classList.add('shot');
const $ = (id) => document.getElementById(id);
const PT = window.PT = { ready: false, errors: [], said: [] };
addEventListener('error', (e) => PT.errors.push(String(e.message)));
const renderer = new THREE.WebGLRenderer({ antialias: Q.get('q') !== 'potato' });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 5000);
const say = (text) => { PT.said.push({ text, t: +(performance.now() / 1000).toFixed(2) }); toast(text); };

const [W, folk, animals] = await Promise.all([
  makeWorld({ renderer, camera, quality: Q.get('q') || undefined, onProgress: (p, text) => { $('load').textContent = `${text}… ${Math.round(p * 100)}%`; } }),
  loadFolk(),
  loadAnimals(undefined, { kinds: ['horse', 'cow'] }),
]);
$('load').remove();

const rider = { name: 'Test', look: { outfit: 'farmer_m', palette: 'drifter' }, owned: { saddle: Q.get('saddle') || null, horse: 'bay', dog: null } };
const I = makeInput(renderer.domElement, { camera });
const P = makePlayer({ W, folk, animals, rider, input: I, camera, say });
const R = makeTargetRing({ scene: W.scene, camera, canvas: renderer.domElement, W });

let toastEl = null, toastT = 0;
function toast(text) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.style.cssText = 'position:fixed;left:50%;bottom:13%;transform:translateX(-50%);z-index:30;background:rgba(30,20,12,.85);color:#f3e6c8;font:600 17px Georgia,serif;padding:9px 18px;border-radius:7px;pointer-events:none;transition:opacity .3s'; document.body.appendChild(toastEl); }
  toastEl.textContent = text; toastEl.style.opacity = '1'; clearTimeout(toastT); toastT = setTimeout(() => { toastEl.style.opacity = '0'; }, 2600);
}

// ── THE HERD AND THE BANDITS: a number over each ───────────────────────────────────────────────────────────────
function numberSprite(n) {
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 96; const c = cv.getContext('2d');
  c.fillStyle = 'rgba(243,230,200,0.92)'; c.beginPath(); c.roundRect(4, 4, 120, 88, 20); c.fill();
  c.fillStyle = '#3b2a1e'; c.font = '700 64px Georgia, serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(n), 64, 52);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false, toneMapped: false, fog: false })); s.scale.set(0.8, 0.6, 1); s.center.set(0.5, 0); return s;
}
const cows = PT.cows = [], bandits = PT.bandits = [], targets = PT.targets = [];
const PA = W.places.pasture;
function addCow(n, x, z, rot = Math.random() * 6.28) {
  const a = makeAnimal(animals, 'cow', { tint: COATS[cows.length % COATS.length] });
  a.root.position.set(x, W.heightAt(x, z), z); a.root.rotation.y = rot; W.scene.add(a.root);
  const label = numberSprite(n); W.scene.add(label);
  const cow = { a, root: a.root, n, good: n % 6 === 0, label, top: a.tall + 0.35, state: 'graze', t: Math.random() * 4, home: { x, z } };
  cows.push(cow); targets.push(cow); return cow;
}
function addBandit(n, x, z, rot) {
  const p = makePerson(folk, { outfit: bandits.length ? 'casual_m' : 'adventurer_m', palette: 'outlaw', skin: 3 + bandits.length, hair: 1 });
  p.root.position.set(x, W.heightAt(x, z), z); p.root.rotation.y = rot; W.scene.add(p.root); p.play('Idle');
  const label = numberSprite(n); W.scene.add(label);
  const b = { person: p, root: p.root, n, good: n % 6 === 0, label, top: 2.15, state: 'graze', home: { x, z } };
  bandits.push(b); targets.push(b); return b;
}
[[12, -6, 4], [27, 5, -3], [18, 0, 9], [30, -10, -6], [16, 9, 6], [24, -3, -11], [20, 12, -8], [36, -14, 8], [33, 3, 15], [42, 15, 3]]
  .forEach(([n, dx, dz]) => addCow(n, PA.x + dx, PA.z + dz));
if (Q.get('bandits') !== '0') { addBandit(48, PA.x - 18, PA.z + 14, 2.2); addBandit(45, PA.x - 22, PA.z - 12, 1.2); }

// what a cow does: grazes, ambles a few steps now and then; once roped right, it walks off to the corral
function herdStep(t, dt) {
  const r = t.root;
  if (t.person) { t.person.update(dt); return; }
  const a = t.a;
  if (t.state === 'held') { a.update(dt); return; }
  if (t.state === 'corral') {
    const g = W.places.corral.gate, tgt = t.leg === 0 ? g.out : t.leg === 1 ? g.in : W.places.corral;
    const dx = tgt.x - r.position.x, dz = tgt.z - r.position.z, d = Math.hypot(dx, dz);
    if (d < 1) { t.leg++; if (t.leg > 2) { t.state = 'penned'; a.play('Eating'); } }
    else { const h = Math.atan2(dx, dz); r.rotation.y += Math.atan2(Math.sin(h - r.rotation.y), Math.cos(h - r.rotation.y)) * Math.min(1, 4 * dt);
      const v = 2.6, nx = r.position.x + Math.sin(r.rotation.y) * v * dt, nz = r.position.z + Math.cos(r.rotation.y) * v * dt;
      r.position.set(nx, W.heightAt(nx, nz), nz); a.play('Gallop', { speed: v / a.stride.Gallop * 0.8 }); }
  } else if (t.state === 'graze' && !t.busy && !PT.still) {
    if ((t.t -= dt) <= 0) { t.walking = !t.walking && Math.random() < 0.5; t.t = 3 + Math.random() * 5; a.play(t.walking ? 'Walk' : Math.random() < 0.6 ? 'Eating' : 'Idle'); if (t.walking) r.rotation.y += (Math.random() - 0.5) * 2; }
    if (t.walking) { const nx = r.position.x + Math.sin(r.rotation.y) * 0.33 * dt, nz = r.position.z + Math.cos(r.rotation.y) * 0.33 * dt; if (!W.blocked(nx, nz) && Math.hypot(nx - t.home.x, nz - t.home.z) < 8) r.position.set(nx, W.heightAt(nx, nz), nz); else r.rotation.y += 2 * dt; }
  }
  a.update(dt);
}

// ── THE THROW: at the ringed one ─────────────────────────────────────────────────────────────────────────────────
function throwAt(t) {
  if (!t || t.state !== 'graze' || t.busy) return false;
  const body = t.a || t.person;
  const ok = P.throwLasso(body, { good: t.good,
    onLand: (good) => { if (!good) { say('Not me, partner'); if (t.a) t.a.play('Idle_HitReact1', { once: true }); } },
    onCaught: (h) => { t.state = 'held'; say(`Roped the ${t.n}!`); t.handle = h; },
    onMissed: () => { t.busy = false; if (t.a) t.a.play('Idle'); },
    onCancel: () => { t.busy = false; },
  });
  if (ok) { t.busy = true; t.walking = false; if (t.a) t.a.play('Idle', { fade: 0.3 }); }
  return ok;
}
setInterval(() => { for (const c of cows) if (c.state === 'held' && c.handle && !c.handle.held) { c.state = 'corral'; c.leg = 0; } }, 100);
PT.throwAt = throwAt;
// a click (not a drag) throws at what is under it or near it (R.click: a click far from every steer throws at nothing,
// with a hint); a tap ropes the one under or nearest the finger
let hintAt = -1e9;
I.onPick((p) => {
  const t = p.touch ? R.pick(p.x, p.y) : R.click(p.x, p.y);
  if (t) throwAt(t);
  else if (!p.touch && R.target && P.enabled && !P.lassoBusy && performance.now() - hintAt > 4000) { hintAt = performance.now(); toast('Point at one to rope it (or press F)'); }
});
$('tF').onclick = () => I.press('KeyF'); $('tE').onclick = () => I.press('KeyE'); $('tH').onclick = () => I.press('KeyH');

// ── HELPERS FOR RIGS AND THE BUTTONS ─────────────────────────────────────────────────────────────────────────────
const yawOf = () => P.cam.yaw;
// a target put `ahead` metres in front of the player (along the way the camera looks) and `side` to the right
PT.place = (t, ahead, side = 0) => {
  const y = yawOf(), fx = Math.sin(y), fz = Math.cos(y), x = P.position.x + fx * ahead - fz * side, z = P.position.z + fz * ahead + fx * side;
  t.root.position.set(x, W.heightAt(x, z), z); t.home = { x, z }; t.walking = false; t.root.updateMatrixWorld(true);
  return { x, z };
};
PT.facePlayer = (t, turn = 0) => { t.root.rotation.y = Math.atan2(P.position.x - t.root.position.x, P.position.z - t.root.position.z) + turn; };
PT.still = false;                                    // true: the herd stands still (for pictures)
// into a tree's shadow: the tree nearest the pasture with open ground on its shadow side
PT.shade = (minScale = 0.9) => {
  let sun = null; W.scene.traverse((o) => { if (!sun && o.isDirectionalLight) sun = o; });
  const s = sun ? new THREE.Vector3().subVectors(sun.position, sun.target.position).normalize() : new THREE.Vector3(-0.6, 0.6, -0.4);
  const fl = Math.hypot(s.x, s.z) || 1, ax = -s.x / fl, az = -s.z / fl;      // (the way shadows fall, along the ground)
  const lean = 6 / Math.max(0.3, s.y / fl);                                  // (how far the shadow of a crown 6 m up falls from its trunk)
  const trees = (W.V.treeForest && W.V.treeForest.fixed) || [];
  let best = null, bd = Infinity;
  for (const t of trees) {
    const sc = t.scale || 1; if (sc < minScale) continue;
    const x = t.x + ax * lean * sc, z = t.z + az * lean * sc, d = Math.hypot(t.x - PA.x, t.z - PA.z);
    const px = x - az * 9, pz = z + ax * 9;                                   // (the player 9 m off to the side, out in the open)
    if (d < bd && d > 25 && !W.blocked(x, z) && !W.blocked(px, pz) && W.waterAt(x, z) < 0.2 && W.waterAt(px, pz) < 0.2) { bd = d; best = { t, x, z, px, pz }; }
  }
  if (!best) return minScale > 0.5 ? PT.shade(minScale - 0.2) : null;
  P.teleport(best.px, best.pz, Math.atan2(best.x - best.px, best.z - best.pz)); P.cam.snap();
  const c0 = cows[0], c1 = cows[1];
  c0.root.position.set(best.x, W.heightAt(best.x, best.z), best.z); c0.home = { x: best.x, z: best.z };
  const x1 = best.x - ax * 3 + (best.px - best.x) * 0.25, z1 = best.z - az * 3 + (best.pz - best.z) * 0.25;   // (another nearby, toward the sun)
  c1.root.position.set(x1, W.heightAt(x1, z1), z1); c1.home = { x: x1, z: z1 };
  return { tree: { x: best.t.x, z: best.t.z, scale: best.t.scale }, at: { x: best.x, z: best.z }, sun: s.toArray() };
};
PT.mount = async () => {
  if (!P.canRide) { rider.owned.saddle = 'plain'; P.refreshOwned(); }
  P.callHorse();
  const t0 = performance.now();
  while (performance.now() - t0 < 30000) { const s = P.state(); if (s.horse && s.horse.dist < 4.4 && s.horse.speed < 0.3) break; await new Promise((r) => setTimeout(r, 100)); }
  P.mount();
  while (performance.now() - t0 < 36000 && P.state().mode !== 'horse') await new Promise((r) => setTimeout(r, 100));
  return P.state().mode;
};
const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = (e) => { fn(); e.target.blur(); }; $('go').appendChild(b); return b; };
btn('saddle', () => { rider.owned.saddle = 'plain'; P.refreshOwned(); });
btn('to the herd', () => toHerd());
btn('shade', () => PT.shade());
btn('ring on/off', () => { R.visible = !R.visible; });
function toHerd() { P.teleport(PA.x - 20, PA.z - 6, 1.3); P.cam.snap(); }
toHerd();

// ── EACH FRAME ───────────────────────────────────────────────────────────────────────────────────────────────────
const can = (t) => t.state === 'graze';
const cost = PT.ringCost = { avg: 0, worst: 0, n: 0, sum: 0, reset() { this.avg = this.worst = this.n = this.sum = 0; } };
let last = performance.now(), frames = 0, tFps = last, fpsNow = 0;
function step(dt) {
  if (P.enabled && I.enabled && (I.tap('KeyF') || (!P.onHorse && I.tap('Space')))) throwAt(R.target);
  P.update(dt);
  for (const t of targets) { herdStep(t, dt); t.label.position.set(t.root.position.x, t.root.position.y + t.top, t.root.position.z); }
  const a = performance.now();
  R.update(dt, { targets, player: P, reach: MOVE.reach, can, hold: P.lassoBusy, busy: P.lasso.busy });
  const ms = performance.now() - a; cost.n++; cost.sum += ms; cost.avg = cost.sum / cost.n; cost.worst = Math.max(cost.worst, ms);
  W.update(dt); W.render();
}
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = (now - last) / 1000; last = now;
  step(dt);
  if (I.touch) document.body.classList.add('touch');
  frames++; if (now - tFps > 500) { fpsNow = frames * 1000 / (now - tFps); frames = 0; tFps = now;
    const s = P.state(), t = R.target;
    $('hud').textContent = `${W.tier} · ${fpsNow.toFixed(0)} fps · ${renderer.info.render.calls} draws\n`
      + `${s.mode} · lasso ${s.lasso}\n`
      + `ring: ${t ? t.n : '-'} (${R.how}${R.hit ? ', ' + R.hit : ''})${t ? ` · ${R.dist.toFixed(1)} m · ${R.inReach ? 'in reach' : 'out of reach'}` : ''}\n`
      + `ring cost ${cost.avg.toFixed(3)} ms a frame (worst ${cost.worst.toFixed(3)})`; }
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
// a frame's real cost, not held to the screen's refresh: n frames drawn back to back, each waited for (a pixel read back)
PT.frameMs = (n = 60) => { const gl = renderer.getContext(), px = new Uint8Array(4); let worst = 0; const a = performance.now();
  for (let i = 0; i < n; i++) { const f0 = performance.now(); step(1 / 60); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); worst = Math.max(worst, performance.now() - f0); }
  last = performance.now(); return { avg: (performance.now() - a) / n, worst }; };
Object.assign(PT, { W, P, R, I, camera, renderer, step, ready: true });
</script>
</body>
</html>
