<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathwood Valley: the range's cards</title>
<script src="../oops.js"></script>
<link rel="stylesheet" href="../src/ui/fonts/fonts.css">
<style>
  /* The shooting range's math (src/math/numbersense.js) without the range: a card from each step of the ladder, its
     numbers (the right ones marked), the why for each wrong one, and the number line the help card draws for a wrong
     pick (src/missions/shooting.js lineSvg). Address switches: ?seed=5 (other cards), ?width=300 (a phone's line) */
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px; background: #2b2118; color: #f4e8cf; font: 15px/1.4 Bitter, Georgia, serif; }
  h1 { font: 400 26px Rye, Georgia, serif; color: #e2ad4c; margin: 0 0 4px; }
  p.about { margin: 0 0 16px; color: #dccaa5; max-width: 900px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
  .step { background: #f1e6cc; color: #2b1d12; border: 1px solid #8a6a3a; border-radius: 10px; padding: 10px 14px 12px; }
  .step small { display: block; font: 500 12px Bitter, Georgia, serif; color: #8a6a3a; }
  .step b.rule { display: block; font: 700 19px/1.2 Bitter, Georgia, serif; }
  .step .sub { font: 500 13px Bitter, Georgia, serif; color: #6b5236; }
  .nums { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .nums span { padding: 2px 8px; border: 2px solid #b48a3c; border-radius: 5px; background: #f8efda; font-weight: 700; }
  .nums span.is-right { border-color: #3f7a3a; background: #dcebd2; }
  .why { font: 500 13.5px/1.35 Bitter, Georgia, serif; margin: 4px 0; }
  .why i { color: #a83a1e; font-style: normal; font-weight: 700; }
</style>
</head>
<body>
<h1>The range's cards</h1>
<p class="about">One card from each step of the number-sense ladder, as Miss Opal deals them. Green: right to shoot (for an
order card, the one to shoot first). Under each card: the why for its first wrong number, and the number line the help card
draws for that wrong pick.</p>
<div class="grid" id="grid"></div>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
<script type="module">
  import { STEPS, makeNumberSense, rightNow, whyNot, lineFor, numText } from '../src/math/numbersense.js';
  import { makeRng } from '../src/lockbox/generate.js';
  import { lineSvg } from '../src/missions/shooting.js';
  const Q = new URLSearchParams(location.search), rng = makeRng(+(Q.get('seed') || 5)), width = +(Q.get('width') || 360);
  // the line's colours are the help card's (shooting.js puts its css on the page when a job is made: borrowed here)
  const css = document.createElement('style');
  css.textContent = `.bsr-nl text { font: 600 13px Bitter, Georgia, serif; fill: #3b2a1a; text-anchor: middle; }
    .bsr-nl .nl-axis { stroke: #3b2a1a; stroke-width: 2.5; } .bsr-nl .nl-end { fill: #3b2a1a; } .bsr-nl .nl-minor { stroke: #8a7458; } .bsr-nl .nl-major { stroke: #3b2a1a; stroke-width: 1.6; } .bsr-nl .nl-zero { stroke: #2b1d12; stroke-width: 2.6; }
    .bsr-nl .nl-band { fill: rgba(226, 173, 76, 0.38); } .bsr-nl .nl-bandt { font: italic 600 12.5px Bitter, Georgia, serif; fill: #7a5320; } .bsr-nl .nl-open { fill: #f1e6cc; stroke: #7a5320; stroke-width: 2; } .bsr-nl .nl-shut { fill: #7a5320; stroke: #7a5320; stroke-width: 2; } .bsr-nl .nl-num.is-key { font-weight: 800; fill: #7a5320; }
    .bsr-nl .nl-half { stroke: #9a5a1a; stroke-width: 1.6; stroke-dasharray: 3 3; } .bsr-nl .nl-halft { font: italic 600 11px Bitter, Georgia, serif; fill: #9a5a1a; }
    .bsr-nl .nl-arc { fill: none; stroke: #8a3a14; stroke-width: 2; } .bsr-nl .nl-arrow { fill: #8a3a14; } .bsr-nl .nl-arct { font: italic 600 12px Bitter, Georgia, serif; fill: #8a3a14; }
    .bsr-nl .nl-dot.is-other { fill: #8a7a66; } .bsr-nl .nl-dot.is-right { fill: #3f7a3a; } .bsr-nl .nl-pick { fill: #f6d8c8; stroke: #a83a1e; stroke-width: 2.2; } .bsr-nl .nl-pickx { stroke: #a83a1e; stroke-width: 2; } .bsr-nl .nl-exact { fill: #2b1d12; }
    .bsr-nl .nl-dott.is-pick { fill: #a83a1e; font-weight: 800; } .bsr-nl .nl-dott.is-right { fill: #2f6a2a; font-weight: 800; }`;
  document.head.appendChild(css);
  const grid = document.getElementById('grid');
  STEPS.forEach((S, step) => {
    const N = makeNumberSense({ step, placed: true });
    let c; do { c = N.card({ rng }); } while (c.review);
    const now = new Set(rightNow(c)), wrong = c.targets.findIndex((x, i) => !now.has(i));
    const el = document.createElement('div'); el.className = 'step';
    el.innerHTML = `<small>step ${step + 1} of ${STEPS.length} · ${S.label}</small><b class="rule">${c.rule}</b><span class="sub">${c.sub}</span>
      <div class="nums">${c.targets.map((x, i) => `<span class="${now.has(i) ? 'is-right' : ''}">${numText(x.n)}</span>`).join('')}</div>
      ${wrong >= 0 ? `<div class="why"><i>${numText(c.targets[wrong].n)}:</i> ${whyNot(c, wrong)}</div>${lineSvg(lineFor(c, { pick: wrong }), width)}` : ''}`;
    grid.appendChild(el);
  });
  window.READY = true;
</script>
</body>
</html>
