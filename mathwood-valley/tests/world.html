<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathwood Valley: the world alone</title>
<script src="../oops.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #e8e0d0; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 10px; left: 12px; z-index: 5; font: 12px/1.5 ui-monospace, monospace; text-shadow: 0 1px 3px #000; pointer-events: none; white-space: pre; }
  #go { position: fixed; top: 10px; right: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px; max-width: 60vw; justify-content: flex-end; }
  #go button { font: 600 11px ui-monospace, monospace; background: rgba(40, 28, 16, .8); color: #f0d9a8; border: 1px solid #7a5a3a; border-radius: 4px; padding: 5px 8px; cursor: pointer; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; background: #1c140c; font: 600 15px ui-monospace, monospace; color: #f0d9a8; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<div id="load">Loading the world…</div>
<div id="hud"></div>
<div id="go"></div>
<script type="module">
// THE WORLD ALONE (src/world.js), with a free camera (drag to turn, right-drag to slide, wheel to zoom) and red 1.8 m boxes
// standing in for people beside the spawn and at each door. ?q=potato|normal|gaming picks the tier, ?look=summer the drier look,
// ?live works the land out here instead of reading its bake (for the bake rig), ?noboxes hides the boxes. The buttons jump
// to the places. For rigs: window.TW = { W, camera, controls, view(name), ready, fps(seconds), frameMs(n) }.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { makeWorld } from '../src/world.js';

const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: Q.get('q') !== 'potato' });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 5000);
const $ = (id) => document.getElementById(id);
const t0 = performance.now();
const W = await makeWorld({ renderer, camera, look: Q.get('look') || 'green', live: Q.has('live'),
  onProgress: (p, text) => { $('load').textContent = `${text}… ${Math.round(p * 100)}%`; } });
$('load').remove();
const controls = new OrbitControls(camera, renderer.domElement); controls.target = W.camTarget; controls.enableDamping = true; controls.update();
const P = W.places;

// the stand-ins: a 1.8 m box (a grown-up) at the spawn and at each door
if (!Q.has('noboxes')) {
  const m = new THREE.MeshStandardMaterial({ color: 0xc8301e, roughness: 0.8 }), g = new THREE.BoxGeometry(0.5, 1.8, 0.3).translate(0, 0.9, 0);
  const beside = { x: P.spawn.x + Math.cos(P.spawn.rot) * 2.5, z: P.spawn.z - Math.sin(P.spawn.rot) * 2.5 };   // (a step to the spawn's left, out of the views from it)
  for (const p of [beside, ...['cabin', 'stable', 'store', 'sheriff', 'saloon', 'stage'].map((k) => P[k] && P[k].door), P.corral && P.corral.gate].filter(Boolean)) {
    const b = new THREE.Mesh(g, m); b.position.set(p.x, W.heightAt(p.x, p.z), p.z); b.castShadow = b.receiveShadow = true; W.scene.add(b); }
}

// THE VIEWS: where the camera stands and what it looks at (eye: a person's eye height, 1.6 m)
const ground = (x, z, up) => new THREE.Vector3(x, W.heightAt(x, z) + up, z);
function front(b, back, up, lookUp) { const fx = Math.sin(b.rot), fz = Math.cos(b.rot); return { at: ground(b.x + fx * (b.d / 2 + back), b.z + fz * (b.d / 2 + back), up), look: ground(b.x, b.z, lookUp) }; }
const VIEWS = {
  square: () => { const s = P.spawn; return { at: ground(s.x - Math.sin(s.rot) * 3, s.z - Math.cos(s.rot) * 3, 1.6), look: ground(s.x + Math.sin(s.rot) * 20, s.z + Math.cos(s.rot) * 20, 2.5) }; },
  squareBack: () => { const s = P.spawn; return { at: ground(s.x + Math.sin(s.rot) * 3, s.z + Math.cos(s.rot) * 3, 1.6), look: ground(s.x - Math.sin(s.rot) * 20, s.z - Math.cos(s.rot) * 20, 2.5) }; },
  cabin: () => front(P.cabin, 9, 1.6, 2.5), stable: () => front(P.stable, 12, 1.6, 3), store: () => front(P.store, 10, 1.6, 3), sheriff: () => front(P.sheriff, 10, 1.6, 3),
  saloon: () => { const b = P.saloon, s = P.square; return { at: ground(s.x + (b.x - s.x) * 0.3, s.z + (b.z - s.z) * 0.3, 1.6), look: ground(b.x, b.z, 4) }; },   // (from the square: the stage stands off its front left)
  stage: () => front(P.stage, 10, 1.6, 2.5),
  rider: () => { const s = P.square, d = P.stage || P.saloon; return { at: ground(s.x + 4, s.z + 4, 2.4), look: ground(d.x, d.z, 2.4) }; },   // (a rider's eye, 2.4 m up on a horse, from the square toward the stage)
  trail: () => { const t = P.trail, a = t[Math.floor(t.length * 0.15)], b = t[Math.floor(t.length * 0.6)]; return { at: ground(a[0], a[1], 1.6), look: ground(b[0], b[1], 1) }; },
  trailBack: () => { const t = P.trail, a = t[Math.floor(t.length * 0.8)], b = t[Math.floor(t.length * 0.2)]; return { at: ground(a[0], a[1], 1.6), look: ground(b[0], b[1], 2) }; },
  pasture: () => { const p = P.pasture, t = P.trail[P.trail.length - 1], dx = p.x - t[0], dz = p.z - t[1], L = Math.hypot(dx, dz) || 1; return { at: ground(p.x - dx / L * (p.r + 12), p.z - dz / L * (p.r + 12), 3), look: ground(p.x, p.z, 0) }; },
  corral: () => { const c = P.corral, g = c.gate; return { at: ground(g.x + Math.sin(g.rot) * 14, g.z + Math.cos(g.rot) * 14, 3), look: ground(c.x, c.z, 0) }; },
  aerial: () => { const s = P.square, p = P.pasture || s, mx = (s.x + p.x) / 2, mz = (s.z + p.z) / 2; return { at: new THREE.Vector3(mx - 40, W.heightAt(mx, mz) + 150, mz + 170), look: ground(mx, mz, 0) }; },
  top: () => { const s = P.square, p = P.pasture || s, mx = (s.x + p.x) / 2, mz = (s.z + p.z) / 2; return { at: new THREE.Vector3(mx, W.heightAt(mx, mz) + 330, mz + 1), look: ground(mx, mz, 0) }; },
};
function view(name) {   // a named view, or 'x,z,up>x,z,up': from a spot (up: metres over the ground) toward another
  const m = /^(-?[\d.]+),(-?[\d.]+),(-?[\d.]+)>(-?[\d.]+),(-?[\d.]+),(-?[\d.]+)$/.exec(name);
  const v = m ? { at: ground(+m[1], +m[2], +m[3]), look: ground(+m[4], +m[5], +m[6]) } : VIEWS[name]();
  camera.position.copy(v.at); W.camTarget.copy(v.look); camera.lookAt(v.look); controls.update(); }
for (const k of Object.keys(VIEWS)) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => view(k); $('go').appendChild(b); }
view(Q.get('view') || 'square');

// the frame rate over the last second, the draw calls, where the land came from
let frames = 0, fpsNow = 0, last = performance.now(), tFps = last;
const fps = (seconds = 3) => new Promise((res) => { let n = 0; const a = performance.now(); const f = () => { n++; if (performance.now() - a < seconds * 1000) requestAnimationFrame(f); else res(n * 1000 / (performance.now() - a)); }; requestAnimationFrame(f); });
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = (now - last) / 1000; last = now;
  controls.update(); W.update(dt); W.render();
  frames++; if (now - tFps > 1000) { fpsNow = frames * 1000 / (now - tFps); frames = 0; tFps = now;
    const V = W.V; $('hud').textContent = `${W.tier} · ${fpsNow.toFixed(0)} fps · ${renderer.info.render.calls} draws · ${(renderer.info.render.triangles / 1e6).toFixed(2)} M tris\n`
      + `loaded in ${W.loadedIn.toFixed(1)} s · land ${V.BAKE.from}${V.BAKE.why ? ' (' + V.BAKE.why + ')' : ''} · look ${W.look}\n`
      + `camera ${camera.position.x.toFixed(0)}, ${camera.position.z.toFixed(0)} · ${W.settled() ? 'settled' : 'laying'}`; }
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
// a frame's real cost, not capped by the screen's refresh: n frames drawn back to back, each waited for (a pixel read back)
function frameMs(n = 60) { const gl = renderer.getContext(), px = new Uint8Array(4); let worst = 0; const a = performance.now();
  for (let i = 0; i < n; i++) { const f0 = performance.now(); W.update(1 / 60); W.render(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); worst = Math.max(worst, performance.now() - f0); }
  return { avg: (performance.now() - a) / n, worst }; }
window.TW = { W, camera, controls, view, fps, frameMs, renderer, ready: true, loadMs: performance.now() - t0 };
</script>
</body>
</html>
