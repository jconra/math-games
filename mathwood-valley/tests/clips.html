<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathwood Valley: lasso and riding clips</title>
<script src="../oops.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #b9c4cc; overflow: hidden; font: 13px/1.35 system-ui, sans-serif; }
  canvas { display: block; }
  #bar { position: fixed; left: 8px; top: 8px; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100vw - 16px); align-items: center; }
  #bar button { font: inherit; padding: 4px 9px; border-radius: 5px; border: 1px solid #5b4630; background: #f3ead6; color: #3b2a1e; cursor: pointer; }
  #bar button.on { background: #5b4630; color: #f3ead6; }
  #bar .gap { width: 10px; }
  #bar input[type=range] { width: 160px; }
  #info { position: fixed; left: 8px; bottom: 8px; z-index: 5; color: #2a1d12; background: rgba(243, 234, 214, 0.88); border-radius: 6px;
          padding: 6px 10px; font: 12px/1.45 ui-monospace, monospace; white-space: pre; max-width: calc(100vw - 36px); overflow: hidden; }
  body.shot #bar, body.shot #info { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<div id="bar"></div>
<div id="info">loading...</div>
<script type="module">
// A test page for the clips made in Blender for this game (models/people/clips_m.glb and clips_f.glb): lassoing
// (Lasso_Swing, Lasso_Throw, Lasso_Pull) and riding (Ride, Ride_Gallop). The farmer plays each one; the riding clips put
// him on a horse that walks or gallops in step, wearing a saddle. A red dot marks where a rope leaves the right hand.
//   ?clip=Lasso_Swing   ?outfit=farmer_m | adventurer_f | ...   ?view=front | side | back | chase | top   ?shot (no buttons)
//   ?saddle=basic | battle | fancy | none   ?seat=offset | siton   ?marks (where the seat of the trousers is and should be)
// window.CLIPS for the rigs: { ready, names, durations, play(name), at(t), pause(on), view(name), info(), crotchAt(name, t),
//   seatOffset() }
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { loadFolk, makePerson } from '../src/actors/folk.js';
import { loadAnimals, makeAnimal, saddleOn, sitOn } from '../src/actors/animals.js';

const Q = new URLSearchParams(location.search);
if (Q.has('shot')) document.body.classList.add('shot');
const NEW = ['Lasso_Swing', 'Lasso_Throw', 'Lasso_Pull', 'Ride', 'Ride_Gallop'];
const ONCE = { Lasso_Throw: true };
// the horse's clip under each riding clip (both loops are as long as the horse's own, so they play at the same speed)
const HORSE = { Ride: 'Walk', Ride_Gallop: 'Gallop' };
const C = window.CLIPS = { ready: false, names: [], durations: {}, errors: [] };

const R = new THREE.WebGLRenderer({ antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.setSize(innerWidth, innerHeight);
R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb9c4cc);
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x6b5a44, 1.4));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6); sun.position.set(-4, 9, 6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4; sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -4;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 30; sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.MeshStandardMaterial({ color: 0x9c8460, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// a line a metre ahead on the ground: the way the person faces (+Z)
const ahead = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.005, 1), new THREE.MeshBasicMaterial({ color: 0x5b4630 }));
ahead.position.set(0, 0.003, 1); scene.add(ahead);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 200);
const orbit = new OrbitControls(cam, R.domElement);
addEventListener('resize', () => { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); if (person) view(viewName); });

// where a camera stands for each view, from the person (who faces +Z; their right hand side is -X)
const VIEWS = {
  front: [0, 0.15, 1], side: [-1, 0.15, 0], back: [0, 0.15, -1], chase: [-0.25, 0.42, -1], top: [0, 1, -0.02], q34: [-0.75, 0.35, 0.75],
};
let viewName = Q.get('view') || 'chase';
function view(name) {
  viewName = name;
  // (further back on a narrow, upright screen, so a horse still fits across it)
  const riding = !!HORSE[cur], d = (riding ? 6.5 : 5.2) * Math.max(1, (riding ? 1.0 : 0.7) / cam.aspect);
  const tgt = new THREE.Vector3(0, riding ? 1.35 : 1.0, riding ? 0.2 : 0);
  const v = new THREE.Vector3(...VIEWS[name]).normalize().multiplyScalar(d);
  cam.position.copy(tgt).add(v); orbit.target.copy(tgt); orbit.update();
  for (const b of bar.querySelectorAll('[data-view]')) b.classList.toggle('on', b.dataset.view === name);
}

const bar = document.getElementById('bar'), info = document.getElementById('info');
function button(text, fn, data = {}) { const b = document.createElement('button'); b.textContent = text; b.onclick = fn; Object.assign(b.dataset, data); bar.appendChild(b); return b; }
function gap() { const g = document.createElement('span'); g.className = 'gap'; bar.appendChild(g); }

let person, horse, cur = '', paused = false, speed = 1, seq = null;
const dot = new THREE.Mesh(new THREE.SphereGeometry(0.018, 12, 8), new THREE.MeshBasicMaterial({ color: 0xd02010, depthTest: false }));
dot.renderOrder = 10; scene.add(dot);
// where a rope leaves the right hand: the middle of the fist, between the wrist and the knuckles (bones WristR, Middle1R)
const ROPE_FROM = 0.5;
function ropePoint(v = new THREE.Vector3()) {
  const w = person.bones.WristR.getWorldPosition(new THREE.Vector3()), k = person.bones.Middle1R.getWorldPosition(new THREE.Vector3());
  return v.copy(w).lerp(k, ROPE_FROM).addScaledVector(k.sub(w).normalize(), 0.03);
}

// the rider on the horse, as the game should do it (?seat=offset, the default): the person's root goes at a fixed offset
// from the saddle's origin (the point resting on the horse's back: animal.seat()), turned with the horse. The riding
// clips are made so that this puts the seat of the trousers in the saddle (0.07 m behind its origin, 0.147 m above it)
// and the balls of the feet on the stirrups, for the men's and the women's skeletons alike (build_clips.py prints the
// offset). Fixed, so the clip's own bob and the gallop's rising out of the saddle still show. For a person scaled from
// their real size, scale the offset with them.
// ?seat=siton seats them with animals.js's sitOn instead (it holds the Hips bone over the saddle's seat), to compare.
const RIDER_FROM_SADDLE = new THREE.Vector3(0, -0.610, -0.065);
const SEAT_IN_SADDLE = new THREE.Vector3(0, 0.147, -0.07);   // where the seat of the trousers should land
const SEAT_MODE = Q.get('seat') === 'siton' ? 'siton' : 'offset';
let crotch = new THREE.Vector3(0, 0.757, 0);
const _q = new THREE.Quaternion(), _o = new THREE.Vector3();
function seatRider(dt = 0) {
  if (!horse || !HORSE[cur]) return;
  horse.root.updateMatrixWorld(true);
  horse.root.getWorldQuaternion(_q);
  const s = horse.seat(new THREE.Vector3());
  if (SEAT_MODE === 'siton') sitOn(horse, person, { dt });
  else {
    person.root.quaternion.copy(_q);
    person.root.position.copy(s).add(_o.copy(RIDER_FROM_SADDLE).applyQuaternion(_q));
  }
  if (marks) {
    marks.seat.position.copy(s).add(_o.copy(SEAT_IN_SADDLE).applyQuaternion(_q));
    marks.crotch.position.copy(crotch).applyQuaternion(_q).add(person.root.position);
  }
}
// ?marks: a blue dot where the seat of the trousers should be, a green one where it is at the clip's start
const marks = Q.has('marks') ? {} : null;
if (marks) for (const [k, c] of [['seat', 0x2040ff], ['crotch', 0x10c040]]) {
  marks[k] = new THREE.Mesh(new THREE.SphereGeometry(0.02, 12, 8), new THREE.MeshBasicMaterial({ color: c, depthTest: false }));
  marks[k].renderOrder = 11; scene.add(marks[k]);
}

function act(name) { return person.person.actions[name]; }
function play(name, { fade = 0.25 } = {}) {
  if (!act(name)) { console.error('no clip ' + name); return false; }
  const was = cur; cur = name; paused = false;
  person.play(name, { fade, speed, once: !!ONCE[name] });
  const riding = !!HORSE[name];
  if (riding) {
    horse.root.visible = true; horse.play(HORSE[name], { fade, speed });
    // where the crotch is from the root at the clip's start, measured on a copy of the pose
    crotch = crotchAt(name, 0);
  } else { horse.root.visible = false; person.root.position.set(0, 0, 0); person.root.quaternion.identity(); }
  for (const b of bar.querySelectorAll('[data-clip]')) b.classList.toggle('on', b.dataset.clip === name);
  if (!!HORSE[was] !== riding) view(viewName);
  return true;
}
// the Hips bone's height above the person's root at time t of a clip, read off a second copy of the person that is
// never drawn (so the one on screen keeps whatever it is doing)
let probe = null;
function hipsAt(name, t) {
  const m = probe.person.mixer, a = probe.person.actions[name];
  for (const x of Object.values(probe.person.actions)) x.stop();
  a.reset().play(); a.time = t; m.update(0);
  probe.root.updateMatrixWorld(true);
  return probe.bones.Hips.getWorldPosition(new THREE.Vector3()).y - probe.root.position.y;
}
// the crotch at time t of a clip, from the person's root (they face +Z): the lowest point of the skinned body near its
// middle line, worked out vertex by vertex on the copy
function crotchAt(name, t) {
  hipsAt(name, t);
  const mesh = probe.mesh, n = mesh.geometry.attributes.position.count, v = new THREE.Vector3();
  const inv = probe.root.matrixWorld.clone().invert(), best = new THREE.Vector3(0, 9, 0);
  for (let i = 0; i < n; i++) {
    mesh.getVertexPosition(i, v); v.applyMatrix4(mesh.matrixWorld).applyMatrix4(inv);
    if (Math.abs(v.x) < 0.04 && Math.abs(v.z) < 0.2 && v.y > 0.3 && v.y < best.y) best.copy(v);
  }
  return best;
}
// a fixed pose: the clip alone at time t, nothing fading, the clock stopped (for screenshots)
function at(t) {
  const m = person.person.mixer, a = act(cur);
  for (const x of Object.values(person.person.actions)) if (x !== a) x.stop();
  a.reset().play(); a.setEffectiveWeight(1); a.time = Math.min(t, a.getClip().duration); m.update(0);
  if (horse.root.visible) {
    const h = horse.actions[HORSE[cur]];
    for (const x of Object.values(horse.actions)) if (x !== h) x.stop();
    h.reset().play(); h.setEffectiveWeight(1); h.time = t % h.getClip().duration; horse.mixer.update(0);
  }
  paused = true; seatRider(); return true;
}

// one throw in order: idle, swing the loop, throw, haul on the rope, back to idle
async function sequence() {
  const id = seq = {};
  const wait = (s) => new Promise((ok) => setTimeout(ok, s * 1000 / speed));
  for (const [name, s] of [['Idle', 1], ['Lasso_Swing', 2.2], ['Lasso_Throw', 1.3], ['Lasso_Pull', 3.6], ['Idle', 0]]) {
    if (seq !== id) return; play(name, { fade: name === 'Lasso_Throw' ? 0.12 : 0.3 }); if (s) await wait(s);
  }
}

function report() {
  const a = act(cur); if (!a) return '';
  const hips = person.bones.Hips.getWorldPosition(new THREE.Vector3()).y - person.root.position.y;
  const p = ropePoint();
  return `${cur}  ${a.time.toFixed(2)} / ${a.getClip().duration.toFixed(2)} s${ONCE[cur] ? ' (once, holds)' : ' (loop)'}  speed ${speed}\n` +
    `rope hand (red dot) ${p.x.toFixed(2)} ${p.y.toFixed(2)} ${p.z.toFixed(2)}   hips over root ${hips.toFixed(3)} m` +
    (HORSE[cur] ? `\nhorse: ${HORSE[cur]}, seat ${horse.seat(new THREE.Vector3()).toArray().map((x) => x.toFixed(2)).join(' ')}` +
      `  crotch from root ${crotch.toArray().map((x) => x.toFixed(3)).join(' ')}  root from saddle origin ${seatOffset().map((x) => x.toFixed(3)).join(' ')}` : '');
}
// where the person's root is from the saddle's origin (horse.seat()), in the horse's own frame
function seatOffset() {
  const s = horse.seat(new THREE.Vector3()), r = person.root.getWorldPosition(new THREE.Vector3()).sub(s);
  return r.applyQuaternion(horse.root.getWorldQuaternion(new THREE.Quaternion()).invert()).toArray();
}

async function start() {
  const outfit = Q.get('outfit') || 'farmer_m';
  const [folk, animals] = await Promise.all([loadFolk('../'), loadAnimals('../', { kinds: ['horse'] })]);
  // the new clips, added to their skeleton's own (the game's people.json may already list them as extraClips)
  const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
  for (const body of ['m', 'f']) {
    try { const g = await loader.loadAsync(`../models/people/clips_${body}.glb`); folk.addClips(body, g.animations); }
    catch (e) { if (body === 'm') throw e; console.warn('no clips_' + body + '.glb yet'); }
  }
  person = makePerson(folk, { outfit, palette: 'drifter' });
  probe = makePerson(folk, { outfit, palette: 'drifter', shadows: false });
  scene.add(person.root);
  horse = makeAnimal(animals, 'horse'); scene.add(horse.root);
  // ?saddle=basic | battle | fancy | none
  const kindOfSaddle = Q.get('saddle') || 'basic';
  if (kindOfSaddle !== 'none') saddleOn(horse, (await loader.loadAsync(`../models/saddles/${kindOfSaddle}.glb`)).scene);
  horse.root.visible = false;
  const all = folk.clips[person.body];
  for (const n of NEW) { const c = all.find((x) => x.name === n); if (c) { C.names.push(n); C.durations[n] = +c.duration.toFixed(3); } }
  for (const n of NEW) button(n.replace('_', ' '), () => { seq = null; play(n); }, { clip: n });
  gap(); button('Idle', () => { seq = null; play('Idle'); }, { clip: 'Idle' }); button('Walk', () => { seq = null; play('Walk'); }, { clip: 'Walk' });
  button('Throw in order', () => sequence());
  gap(); for (const v of Object.keys(VIEWS)) button(v, () => view(v), { view: v });
  gap(); for (const s of [0.25, 0.5, 1]) button(s + 'x', () => { speed = s; if (cur) person.play(cur, { speed }); if (horse.root.visible) horse.play(HORSE[cur], { speed }); });
  button('pause', () => { paused = !paused; });
  const scrub = document.createElement('input'); scrub.type = 'range'; scrub.min = 0; scrub.max = 1; scrub.step = 0.001; scrub.value = 0;
  scrub.oninput = () => { seq = null; const a = act(cur); if (a) at(+scrub.value * a.getClip().duration); };
  bar.appendChild(scrub);
  play(Q.get('clip') || 'Lasso_Swing', { fade: 0 }); view(viewName);
  C.person = person; C.horse = horse; C.ready = true;
}

C.play = (n) => { seq = null; return play(n, { fade: 0 }); };
C.at = at; C.view = view; C.pause = (on = true) => { paused = on; };
C.ropePoint = () => ropePoint().toArray();
C.hipsAt = (n, t) => hipsAt(n, t);
C.crotchAt = (n, t) => crotchAt(n, t).toArray();
C.seatOffset = () => seatOffset();
C.info = () => report();

const clock = new THREE.Clock();
R.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (person) {
    if (!paused) { person.update(dt); if (horse.root.visible) horse.update(dt); }
    seatRider(paused ? 0 : dt);
    person.root.updateMatrixWorld(true);
    ropePoint(dot.position);
    info.textContent = report();
  }
  R.render(scene, cam);
});
start().catch((e) => { C.errors.push(String(e)); console.error(e); info.textContent = 'failed: ' + e.message; });
</script>
</body>
</html>
