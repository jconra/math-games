<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Material Lab</title>
<meta name="description" content="A Mathwood Valley lab: a cabin built from parts, procedural textures and a trim sheet, and shader weathering (moss, grime, edge wear) placed automatically, with decals and a side-by-side against a scanned model.">
<!-- the on-screen error box comes first, so a crash shows on screen instead of a blank page -->
<script src="../../oops.js"></script>
<link rel="stylesheet" href="../../src/ui/fonts/fonts.css">
<link rel="stylesheet" href="materials.css?v=1">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="A cabin built from parts, on a patch of ground"></canvas>
  <div class="stats" id="stats" aria-live="polite"></div>
  <div class="legend" id="legend" hidden></div>
  <div class="hint" id="hint" hidden></div>
  <button class="btn panel-toggle" id="panelToggle" aria-expanded="true" aria-controls="panel">Controls</button>
  <aside class="panel" id="panel" aria-label="Material controls"></aside>
</div>
<div class="loading" id="loading">Cutting the boards…</div>
<script type="module" src="main.js?v=4"></script>
</body>
</html>
