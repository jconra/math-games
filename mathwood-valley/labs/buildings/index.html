<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Building Lab</title>
<meta name="description" content="A Mathwood Valley lab: the town's buildings built from parts in code, ready to walk into. A livery stable (stalls with the game's horses in them, a hayloft, lanterns), a sheriff's office with its stone jail (a false front, wanted posters, cells behind strap-iron bars) and a general store (a whitewashed false front, display windows full of goods, a counter, shelves to the ceiling, a lean-to storeroom with a hoist).">
<!-- the on-screen error box comes first, so a crash shows on screen instead of a blank page -->
<script src="../../oops.js"></script>
<link rel="stylesheet" href="../../src/ui/fonts/fonts.css">
<link rel="stylesheet" href="../materials/materials.css?v=1">
<link rel="stylesheet" href="../stone/stone.css?v=2">
<link rel="stylesheet" href="buildings.css?v=2">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="A town building built from parts: a livery stable, a sheriff's office and jail, or a general store"></canvas>
  <!-- over the view, top right: Controls (phones), the doors open or shut, the next building -->
  <div class="viewbtns">
    <button class="btn panel-toggle" id="panelToggle" aria-expanded="true" aria-controls="panel">Controls</button>
    <button class="btn" id="doorsBtn" aria-pressed="true">Doors: open</button>
    <button class="btn" id="nextBtn" aria-label="Next building">Next ›</button>
  </div>
  <aside class="panel" id="panel" aria-label="Building controls"></aside>
</div>
<div class="loading" id="loading">Building…</div>
<script type="module" src="main.js?v=6"></script>
</body>
</html>
