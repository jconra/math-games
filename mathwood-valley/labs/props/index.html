<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Props Lab</title>
<meta name="description" content="A Mathwood Valley lab: the town's furniture, goods and yard things, one shared library the game and the labs both build from.">
<!-- the on-screen error box comes first, so a crash shows on screen instead of a blank page -->
<script src="../../oops.js"></script>
<link rel="stylesheet" href="../../src/ui/fonts/fonts.css">
<link rel="stylesheet" href="props.css?v=1">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c" aria-label="A prop on a plank floor"></canvas>
<div class="pl-top">
  <h1>Props Lab</h1><a href="../">All labs</a>
  <span class="pl-hud" id="hud" aria-live="polite"></span>
</div>
<div class="pl-tags" id="tags" aria-hidden="true"></div>
<!-- ONE MENU: the bar along the bottom (the props of the category as pictures, then the categories and the views); the recipe opens just over it -->
<div class="pl-drawer" id="drawer" hidden></div>
<nav class="pl-bar" id="bar" aria-label="Props Lab menu">
  <div class="pl-thumbs" id="thumbs" role="listbox" aria-label="Props"></div>
  <div class="pl-tabs" id="tabs"></div>
</nav>
<div class="pl-loading" id="loading">Stocking the shelves…</div>
<script type="module" src="main.js?v=2"></script>
</body>
</html>
