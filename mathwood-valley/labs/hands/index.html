<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hands Lab</title>
<meta name="description" content="A Mathwood Valley lab: a pose editor for the band. Every bone of the fiddler, the banjo player and the harmonica player, each with only the joints it really has, and their instruments moved and held by any bone, over any clip and frame, saved to a file the game reads.">
<!-- the on-screen error box comes first, so a crash shows on screen instead of a blank page -->

<link rel="stylesheet" href="../../src/ui/fonts/fonts.css">
<link rel="stylesheet" href="../dogs/dogs.css?v=2">

<body>
<canvas id="c" aria-label="A band player with an instrument on a plain floor"></canvas>
<div class="dl-top">
  <h1>Hands Lab</h1><a href="../">All labs</a>
  <span class="dl-hud" id="hud" aria-live="polite"></span>

</nav>
