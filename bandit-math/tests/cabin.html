<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bandit Math: walk into the cabin</title>
<script src="../oops.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #e8e0d0; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 10px; left: 12px; z-index: 5; font: 12px/1.5 ui-monospace, monospace; text-shadow: 0 1px 3px #000; pointer-events: none; white-space: pre; }
  #keys { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5; font: 12px/1.5 ui-monospace, monospace; text-shadow: 0 1px 3px #000; pointer-events: none; opacity: .9; text-align: center; }
  #hint { position: fixed; left: 50%; top: 58%; transform: translateX(-50%); z-index: 5; font: 600 14px ui-monospace, monospace; color: #f0d9a8; text-shadow: 0 1px 4px #000; pointer-events: none; display: none; }
  #dot { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(255, 240, 210, .7); z-index: 5; pointer-events: none; }
  #touch { position: fixed; left: 0; right: 0; bottom: 22px; z-index: 6; display: none; justify-content: space-between; padding: 0 22px; pointer-events: none; }
  #touch button { pointer-events: auto; width: 76px; height: 76px; border-radius: 50%; font: 600 13px ui-monospace, monospace; background: rgba(40, 28, 16, .75); color: #f0d9a8; border: 1px solid #7a5a3a; touch-action: none; user-select: none; -webkit-user-select: none; }
  #touch button.held { background: rgba(120, 84, 40, .9); }
  body.touch #touch { display: flex; }
  body.touch #keys { display: none; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; z-index: 7; background: #1c140c; font: 600 15px ui-monospace, monospace; color: #f0d9a8; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<div id="load">Loading the cabin…</div>
<div id="hud"></div>
<div id="dot"></div>
<div id="hint">E: open the door</div>
<div id="keys">click: look with the mouse (Esc lets go) · WASD / arrows: walk · Shift: hurry · E by the door: open / shut it</div>
<div id="touch"><button id="tWalk">Walk</button><button id="tDoor">Door</button></div>
<script type="module">
// THE CABIN, WALKED INTO (models/town/cabin_inside.glb on its own: plain ground and sky, no valley). You stand on the porch
// facing the door, eyes 1.65 m up. PC: click to look with the mouse, WASD or the arrows to walk, Shift to hurry, E near the
// door to swing it open or shut. Phone: drag to look, hold Walk to walk, Door by the door.
// The sun casts shadows, so the room is darker than outdoors except where it shines in through the windows and the open
// door; two lanterns hang from the beams. The sky's light on the inside surfaces is turned down (it can't reach in
// there much), which is what makes the room read as indoors, and a faint warm bounced light keeps its shadows from black.
// Walls stop you: two balls (knee and chest high) are pushed sideways out of every nearby wall-like triangle; the floor
// under you is found by rays straight down from five places under the feet, so the porch steps can be climbed and the
// room's floor walked on. The door pushes you out of its way as it swings; if you are pinned it stops and the hint says so.
//   ?at=room   start inside, by the back wall, looking at the door;  ?hud   where you stand and the door's angle, top left
// For rigs: window.CB = { ready, errors, player: { x, y (feet), z, yaw, pitch }, door: { open, angle (degrees) },
//   nearDoor, frames, camera, renderer, scene }
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const Q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const CB = window.CB = { ready: false, errors: [], frames: 0 };
addEventListener('error', (e) => CB.errors.push(String(e.message)));
const touch = matchMedia('(pointer: coarse)').matches;
if (touch) document.body.classList.add('touch');

// ---- the scene: sky, ground, sun, sky light, lantern --------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc0e0);
scene.fog = new THREE.Fog(0x9cc0e0, 60, 220);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 400);
// (70 degrees up and down on a wide screen; a tall phone screen gets more, so it still sees about 60 degrees across)
const fitFov = () => { const a = innerWidth / innerHeight; camera.aspect = a; camera.fov = a >= 1 ? 70 : Math.min(95, THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(30)) / a))); camera.updateProjectionMatrix(); };
fitFov();

const ground = new THREE.Mesh(new THREE.CircleGeometry(200, 48), new THREE.MeshStandardMaterial({ color: 0x6f7a45, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const sky = new THREE.HemisphereLight(0xcfe2ff, 0x6b5a40, 1.6); scene.add(sky);
// the sun: late in the day, low (22 degrees) from the front right, so it gets under the porch roof and falls in through
// the door, the front windows and the right-hand window onto the floor and walls
const sun = new THREE.DirectionalLight(0xffe6c4, 3.4);
sun.position.set(7, 5.5, 7.5); sun.target.position.set(0, 1, -1); scene.add(sun, sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = -10; sc.right = 10; sc.top = 10; sc.bottom = -10; sc.near = 1; sc.far = 40;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;

// the lanterns: small glowing lamps hanging from the left-hand beam (off the way from the door to the back) and the
// right-hand one, each with a warm light that fades out across the room, so no corner of it is left in the dark
const glowPicture = (() => {           // a soft round glow, bright in the middle, fading to nothing at the edge
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const LANTERNS = [new THREE.Vector3(-0.69, 2.84, -1.75), new THREE.Vector3(1.44, 2.84, -1.0)];
for (const at of LANTERNS) {
  const lamp = new THREE.PointLight(0xffc488, 3.2, 9, 1.4); lamp.position.copy(at); scene.add(lamp);
  const g = new THREE.Group(); g.position.copy(at);
  const metal = new THREE.MeshStandardMaterial({ color: 0x2a2520, roughness: 0.6, metalness: 0.6 });
  // smoky amber glass you can see the flame through, the flame itself (unlit: it is the light), and a soft glow round it
  const glass = new THREE.MeshStandardMaterial({ color: 0x3a2814, emissive: 0xff8a30, emissiveIntensity: 0.25, roughness: 0.15, transparent: true, opacity: 0.45, depthWrite: false });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.16, 12), glass);
  const flame = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffe2a0 }));
  flame.scale.set(0.014, 0.032, 0.014); flame.position.y = -0.02; g.add(flame);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowPicture, color: 0xffb060, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.55 }));
  glow.scale.set(0.42, 0.42, 1); glow.position.y = -0.02; g.add(glow);
  for (let k = 0; k < 4; k++) {          // the wire guards round the glass
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.18, 0.008), metal);
    bar.position.set(Math.cos(k * Math.PI / 2 + 0.4) * 0.07, 0, Math.sin(k * Math.PI / 2 + 0.4) * 0.07); g.add(bar);
  }
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.085, 0.07, 12), metal); cap.position.y = 0.125;
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.025, 12), metal); base.position.y = -0.095;
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.2, 4), metal); cord.position.y = 0.26;
  g.add(body, cap, base, cord); scene.add(g);
}

// ---- the cabin -----------------------------------------------------------------------------------------------------------
const gltf = await new GLTFLoader().loadAsync('../models/town/cabin_inside.glb');
const cabin = gltf.scene; scene.add(cabin);
const hinge = cabin.getObjectByName('DoorHinge');
if (!hinge) throw new Error('cabin_inside.glb has no DoorHinge');
// the sky's light on the inside surfaces, turned down (a uniform the shader multiplies the light from the sky by), and a
// faint warm light added from every side: the lanterns' and the sun's light bounced round the room, so the undersides of
// the beams and the corners up by the roof aren't black
const insideSky = { value: 0.6 }, insideFill = { value: new THREE.Color(0.11, 0.085, 0.06) };
cabin.traverse((o) => {
  if (!o.isMesh) return;
  o.castShadow = o.receiveShadow = true;
  for (const m of [].concat(o.material)) {
    for (const t of [m.map, m.normalMap]) if (t) t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    if (!m.name.startsWith('inside')) continue;
    m.onBeforeCompile = (sh) => {
      sh.uniforms.insideSky = insideSky; sh.uniforms.insideFill = insideFill;
      sh.fragmentShader = 'uniform float insideSky;\nuniform vec3 insideFill;\n' + sh.fragmentShader.replace('#include <lights_fragment_end>', 'irradiance = irradiance * insideSky + insideFill;\n#include <lights_fragment_end>');
    };
  }
});
cabin.updateMatrixWorld(true);

// ---- what you can bump into: every triangle of the cabin in a grid of half-metre cells (the door's own, moved each frame) --
// (each entry: { t: the triangle, y0, y1: its lowest and highest point, ny: how much it faces up or down })
const CELL = 0.5, cells = new Map(), stat = [], doorTris = [];
const key = (i, j) => i * 4096 + j;
const entry = (tri) => { const e = { t: tri, y0: 0, y1: 0, ny: 0 }; fit(e); return e; };
const nrm = new THREE.Vector3();
function fit(e) { const t = e.t; e.y0 = Math.min(t.a.y, t.b.y, t.c.y); e.y1 = Math.max(t.a.y, t.b.y, t.c.y); e.ny = t.getNormal(nrm).y; }
function addTris(mesh, list, toGrid) {
  const g = mesh.geometry, P = g.attributes.position, I = g.index, n = I ? I.count : P.count;
  for (let k = 0; k < n; k += 3) {
    const t = [0, 1, 2].map((q) => new THREE.Vector3().fromBufferAttribute(P, I ? I.getX(k + q) : k + q).applyMatrix4(mesh.matrixWorld));
    const tri = entry(new THREE.Triangle(t[0], t[1], t[2])); list.push(tri);
    if (!toGrid) continue;
    const x0 = Math.floor(Math.min(t[0].x, t[1].x, t[2].x) / CELL), x1 = Math.floor(Math.max(t[0].x, t[1].x, t[2].x) / CELL);
    const z0 = Math.floor(Math.min(t[0].z, t[1].z, t[2].z) / CELL), z1 = Math.floor(Math.max(t[0].z, t[1].z, t[2].z) / CELL);
    for (let i = x0; i <= x1; i++) for (let j = z0; j <= z1; j++) { const c = cells.get(key(i, j)); if (c) c.push(tri); else cells.set(key(i, j), [tri]); }
  }
}
const doorMeshes = [];
cabin.traverse((o) => { if (!o.isMesh) return; let d = false; for (let p = o; p; p = p.parent) if (p === hinge) d = true; if (d) doorMeshes.push(o); else addTris(o, stat, true); });
const doorLocal = []; for (const m of doorMeshes) { const l = []; addTris(m, l, false); doorLocal.push(...l); }
const hingeInv = new THREE.Matrix4().copy(hinge.matrixWorld).invert();
const doorRest = doorLocal.map(({ t }) => new THREE.Triangle(t.a.clone().applyMatrix4(hingeInv), t.b.clone().applyMatrix4(hingeInv), t.c.clone().applyMatrix4(hingeInv)));
for (const t of doorRest) doorTris.push(entry(new THREE.Triangle(new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3())));
function moveDoorTris() {
  hinge.updateMatrixWorld(true);
  doorRest.forEach((t, k) => { const d = doorTris[k]; d.t.a.copy(t.a).applyMatrix4(hinge.matrixWorld); d.t.b.copy(t.b).applyMatrix4(hinge.matrixWorld); d.t.c.copy(t.c).applyMatrix4(hinge.matrixWorld); fit(d); });
}
moveDoorTris();
function near(x, z, r) {
  const out = new Set();
  for (let i = Math.floor((x - r) / CELL); i <= Math.floor((x + r) / CELL); i++) for (let j = Math.floor((z - r) / CELL); j <= Math.floor((z + r) / CELL); j++) { const c = cells.get(key(i, j)); if (c) for (const t of c) out.add(t); }
  for (const t of doorTris) out.add(t);
  return out;
}

// ---- the player --------------------------------------------------------------------------------------------------------
const EYE = 1.65, RADIUS = 0.26, STEP = 0.42, WALK = 1.7, HURRY = 3.2;
const BALLS = [0.62, 1.3];                     // the balls that bump into walls: their middles this high over the feet
const player = { x: 0.24, y: 0.8, z: 2.25, yaw: 0, pitch: -0.05 };   // yaw 0: facing -z (into the cabin)
if (Q.get('at') === 'room') Object.assign(player, { x: 0.3, y: 0.79, z: -2.3, yaw: Math.PI, pitch: -0.05 });
const DOOR_AT = new THREE.Vector3(0.24, 0, 0.72);    // the doorway's middle on the ground plan
const door = { open: false, t: 0, angle: 0, blocked: false };   // t: 0 shut .. 1 open; 0.8 s either way, eased; blocked: you pin it
const OPEN_DEG = 92, SWING_S = 0.8;
const ray = new THREE.Ray(), hitP = new THREE.Vector3(), cp = new THREE.Vector3(), ball = new THREE.Vector3();
const FOOT = [[0, 0], [0.15, 0], [-0.15, 0], [0, 0.15], [0, -0.15]];   // where the floor is felt for under the feet
function floorUnder(x, z, fromY) {      // the highest surface under the feet no higher than fromY (the ground is 0); the
  let best = 0;                          // feet are felt in five places, so the gaps between the porch steps can't drop you
  const tris = near(x, z, 0.2);
  for (const [fx, fz] of FOOT) {
    ray.origin.set(x + fx, fromY, z + fz); ray.direction.set(0, -1, 0);
    for (const { t, y0, ny } of tris) {
      if (Math.abs(ny) < 0.5 || y0 > fromY) continue;
      if (ray.intersectTriangle(t.a, t.b, t.c, false, hitP) && hitP.y > best) best = hitP.y;
    }
  }
  return best;
}
// out of every triangle the balls overlap, sideways only, and only as far as clears it (a ball touching an edge from
// nearly straight above needs only a small step sideways). Surfaces that face up or down (floors, treads, beams) are left
// to the floor: they never push. list: the triangles to test (all nearby ones by default); returns whether it moved you
function pushOut(list) {
  let movedAny = false;
  for (let pass = 0; pass < 3; pass++) {
    let moved = false;
    for (const h of BALLS) {
      ball.set(player.x, player.y + h, player.z);
      for (const { t, y0, y1, ny } of list || near(player.x, player.z, RADIUS + 0.1)) {
        if (Math.abs(ny) > 0.5 || y0 > ball.y + RADIUS || y1 < ball.y - RADIUS) continue;
        t.closestPointToPoint(ball, cp);
        const dx = ball.x - cp.x, dz = ball.z - cp.z, dy = ball.y - cp.y, d = Math.hypot(dx, dy, dz);
        if (!(d < RADIUS)) continue;                                     // (also skips a sliver of a triangle, which gives NaN)
        const flat = Math.hypot(dx, dz); if (flat < 1e-4) continue;      // (straight above or below)
        const push = Math.sqrt(RADIUS * RADIUS - dy * dy) - flat + 0.002;
        if (push <= 0) continue;
        player.x += dx / flat * push; player.z += dz / flat * push; ball.set(player.x, player.y + h, player.z); moved = movedAny = true;
      }
    }
    if (!moved) break;
  }
  return movedAny;
}

// ---- input: keys, mouse look (pointer lock), touch look and buttons --------------------------------------------------------
const keys = new Set();
addEventListener('keydown', (e) => { keys.add(e.code); if (e.code === 'KeyE' && !e.repeat) toggleDoor(); });
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const canvas = renderer.domElement;
canvas.addEventListener('click', () => { if (!touch && document.pointerLockElement !== canvas) canvas.requestPointerLock?.(); });
addEventListener('mousemove', (e) => {
  if (document.pointerLockElement !== canvas) return;
  player.yaw -= e.movementX * 0.0022; player.pitch = THREE.MathUtils.clamp(player.pitch - e.movementY * 0.0022, -1.4, 1.4);
});
let drag = null;
canvas.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') return; drag = { id: e.pointerId, x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  // (the view turns the way the finger moves, as with the mouse: drag right to look right)
  player.yaw -= (e.clientX - drag.x) * 0.005; player.pitch = THREE.MathUtils.clamp(player.pitch - (e.clientY - drag.y) * 0.005, -1.4, 1.4);
  drag.x = e.clientX; drag.y = e.clientY;
});
canvas.addEventListener('pointerup', (e) => { if (drag && e.pointerId === drag.id) drag = null; });
canvas.addEventListener('pointercancel', () => { drag = null; });
let walkHeld = false;
const tWalk = $('tWalk');
tWalk.addEventListener('pointerdown', (e) => { e.preventDefault(); walkHeld = true; tWalk.classList.add('held'); tWalk.setPointerCapture(e.pointerId); });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) tWalk.addEventListener(ev, () => { walkHeld = false; tWalk.classList.remove('held'); });
$('tDoor').addEventListener('pointerdown', (e) => { e.preventDefault(); toggleDoor(); });
for (const b of [tWalk, $('tDoor')]) b.addEventListener('contextmenu', (e) => e.preventDefault());

function setDoor() { door.angle = OPEN_DEG * ease(door.t); hinge.rotation.y = THREE.MathUtils.degToRad(door.angle); moveDoorTris(); }
function doorHitsPlayer() {
  for (const h of BALLS) {
    ball.set(player.x, player.y + h, player.z);
    for (const { t } of doorTris) if (t.closestPointToPoint(ball, cp).distanceTo(ball) < RADIUS * 0.98) return true;
  }
  return false;
}
const nearDoor = () => Math.hypot(player.x - DOOR_AT.x, player.z - DOOR_AT.z) < 1.9;
function toggleDoor() { if (nearDoor()) door.open = !door.open; }

// ---- each frame -----------------------------------------------------------------------------------------------------------
const hud = $('hud'), hint = $('hint'), clock = new THREE.Clock();
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  // the door: eased toward open or shut. If it swings into you it pushes you out of its way; only if you are pinned (say
  // between it and the wall) does it stop, and the hint says so (step away and it carries on)
  const was = door.t;
  door.t = THREE.MathUtils.clamp(door.t + (door.open ? 1 : -1) * dt / SWING_S, 0, 1);
  door.blocked = false;
  if (door.t !== was) {
    setDoor();
    if (doorHitsPlayer()) {
      // (opening, it steps you straight back into the room, out of its swing, so it never sweeps you round behind it;
      // shutting, it pushes you square to its face, out through the doorway)
      const px = player.x, pz = player.z, a = THREE.MathUtils.degToRad(door.angle);
      const mx = door.open ? 0 : Math.sin(a), mz = door.open ? -1 : Math.cos(a);
      for (let k = 0; k < 40 && doorHitsPlayer(); k++) { player.x += mx * 0.02; player.z += mz * 0.02; }
      pushOut();
      if (doorHitsPlayer()) { player.x = px; player.z = pz; door.t = was; setDoor(); door.blocked = true; }
    }
  }
  // walking: forward is where you face, flattened
  let f = 0, s = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp') || walkHeld) f += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
  if (keys.has('KeyD')) s += 1;
  if (keys.has('KeyA')) s -= 1;
  const locked = document.pointerLockElement === canvas;        // (the left and right arrows step sideways with the mouse,
  if (keys.has('ArrowLeft')) { if (locked) s -= 1; else player.yaw += 1.8 * dt; }    // turn without it)
  if (keys.has('ArrowRight')) { if (locked) s += 1; else player.yaw -= 1.8 * dt; }
  const len = Math.hypot(f, s);
  if (len > 0) {
    const sp = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? HURRY : WALK) * dt / len, sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
    const steps = Math.ceil(sp * len / 0.05);                     // (small steps, so a fast frame can't carry you through a wall)
    for (let k = 0; k < steps; k++) {
      player.x += (-sy * f + cy * s) * sp / steps; player.z += (-cy * f - sy * s) * sp / steps;
      pushOut();
    }
  } else pushOut();                                               // (the door may have swung into you)
  // the floor: step up onto what's at most a stair high, fall to what's below
  const fl = floorUnder(player.x, player.z, player.y + STEP);
  player.y = fl > player.y ? THREE.MathUtils.damp(player.y, fl, 18, dt) : Math.max(fl, player.y - 4 * dt);
  camera.position.set(player.x, player.y + EYE, player.z);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
  hint.style.display = nearDoor() ? 'block' : 'none';
  hint.textContent = door.blocked ? 'Step back: you are in the door’s way' : (touch ? 'Door: ' : 'E: ') + (door.open ? 'shut the door' : 'open the door');
  if (Q.has('hud')) hud.textContent = `x ${player.x.toFixed(2)}  z ${player.z.toFixed(2)}  feet ${player.y.toFixed(2)}  door ${door.angle.toFixed(0)}°`;
  renderer.render(scene, camera);
  CB.frames++;
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { fitFov(); renderer.setSize(innerWidth, innerHeight); });
Object.assign(CB, { player, door, camera, renderer, scene });
Object.defineProperty(CB, 'nearDoor', { get: nearDoor });
player.y = floorUnder(player.x, player.z, player.y + STEP);
$('load').remove();
CB.ready = true;
frame();
</script>
</body>
</html>
