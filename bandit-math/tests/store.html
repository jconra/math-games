<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandit Math: the store's order slips</title>
<!-- A dev page for the general store's word problems: the order slip (src/ui/storeslip.js) over a plain backdrop, one
     order of each kind, and every picture (src/ui/storepics.js) on one sheet.
       store.html                    the slip: pick coins; the buttons along the top deal another order of a kind
       store.html?sheet              every kind's picture, three of each
       store.html?type=rate&step=5   start on that kind and step; &wrong=1 shows a wrong pick at once -->
<style>
  body { margin: 0; min-height: 100vh; background: linear-gradient(160deg, #6d7f5a, #3b4a33 60%, #2a2219); font: 14px Bitter, Georgia, serif; color: #f4e8cf; }
  .bar { position: fixed; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 48vw; z-index: 40; }
  .bar button { font: 600 12px ui-monospace, monospace; background: rgba(40, 28, 16, 0.85); color: #f0d9a8; border: 1px solid #7a5a3a; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; padding: 12px; }
  .sheet figure { margin: 0; background: #f6edd6; color: #2b2219; border-radius: 6px; padding: 8px 10px; }
  .sheet figcaption { font-weight: 700; } .sheet p { margin: 4px 0 0; font-size: 13px; } .sheet small { color: #8a7558; }
</style>
</head>
<body>
<script type="module">
import { makeOrder, TYPES, seeded } from '../src/math/wordproblems.js';
import { picture } from '../src/ui/storepics.js';
import { makeStoreSlip } from '../src/ui/storeslip.js';
const Q = new URLSearchParams(location.search);
const rand = seeded(Number(Q.get('seed')) || 1);
if (Q.has('sheet')) {
  const sheet = document.createElement('div'); sheet.className = 'sheet'; document.body.appendChild(sheet);
  for (const type of TYPES) for (const step of [3, 6, 9]) {
    const o = makeOrder(type, { rand, step });
    const p = picture(o.pic);
    const f = document.createElement('figure');
    f.innerHTML = `<figcaption>${type} · ${p.title}</figcaption><small>${o.story} ${o.ask}</small>${p.svg}<p>${p.line}</p><small>answer: ${o.answer}</small>`;
    sheet.appendChild(f);
  }
  window.READY = true;
} else {
  let order = null, gold = 40, filled = 0;
  const U = makeStoreSlip(document.body, {
    onPick: async (i) => {
      const c = order.coins[i];
      if (!c.good) { U.wrong(i, { why: c.why, pic: picture(order.pic) }); return; }
      if (order.equation) { U.equation(i, { line: order.rightWhy }); return; }
      await U.right(i, { line: order.rightWhy, gold: 4, from: gold, to: gold + 4 }); gold += 4; filled++;
      await U.leave(); deal(order.type);
    },
    onDone: () => U.hide(), onDraw: () => U.drawn(picture(order.pic)),
  });
  U.purse(gold);
  const deal = (type) => { order = makeOrder(type, { rand, step: Number(Q.get('step')) || 5 }); U.show(order, { filled }); window.ORDER = order; };
  const bar = document.createElement('div'); bar.className = 'bar'; document.body.appendChild(bar);
  for (const t of TYPES) { const b = document.createElement('button'); b.textContent = t; b.onclick = () => deal(t); bar.appendChild(b); }
  const d = document.createElement('button'); d.textContent = 'draw offer'; d.onclick = () => U.offerDraw(true); bar.appendChild(d);
  deal(Q.get('type') || 'groups');
  if (Q.has('wrong')) { const i = order.coins.findIndex((c) => !c.good); U.wrong(i, { why: order.coins[i].why, pic: picture(order.pic) }); }
  window.U = U; window.READY = true;
}
</script>
</body>
</html>
