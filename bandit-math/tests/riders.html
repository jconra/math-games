<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bandit Math: riders</title>
<script src="../oops.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #b9c4cc; overflow: hidden; font: 13px/1.35 system-ui, sans-serif; }
  canvas { display: block; }
  #bar { position: fixed; left: 8px; top: 8px; z-index: 5; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100vw - 16px); }
  #bar button { font: inherit; padding: 4px 9px; border-radius: 5px; border: 1px solid #5b4630; background: #f3ead6; color: #3b2a1e; cursor: pointer; }
  #info { position: fixed; left: 8px; bottom: 8px; z-index: 5; color: #2a1d12; background: rgba(243, 234, 214, 0.88); border-radius: 6px; padding: 6px 10px; font: 12px/1.45 ui-monospace, monospace; white-space: pre; }
  body.shot #bar, body.shot #info { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<div id="bar"></div>
<div id="info">loading...</div>
<script type="module">
// A test page for the riders of "Protect the wagon" (src/actors/riders.js): a few riders circling on flat ground at a
// walk or a gallop, with their numbers; buttons tip a hat and pull one from the saddle (it lands hogtied).
//   ?speed=3  ?n=4  ?view=side|rside|chase|top|low|down|far  ?shot (no buttons)
// window.RIDE for rigs: { ready, riders, speed(v), tip(i), fall(i), view(name), freeze(on), errors }
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { loadFolk, makePerson } from '../src/actors/folk.js';
import { loadAnimals } from '../src/actors/animals.js';
import { loadRiderKit, makeRider, RIDERS, tiePose, TIE } from '../src/actors/riders.js';

const Q = new URLSearchParams(location.search);
if (Q.has('shot')) document.body.classList.add('shot');
const RIDE = window.RIDE = { ready: false, errors: [] };
addEventListener('error', (e) => RIDE.errors.push(String(e.message)));
const R = new THREE.WebGLRenderer({ antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.setSize(innerWidth, innerHeight);
R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb9c4cc);
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x6b5a44, 1.4));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.6); sun.position.set(-8, 14, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.entries({ left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 60 }).forEach(([k, v]) => { sun.shadow.camera[k] = v; });
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: 0x9c8460, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// a grid of lines on the ground, so sliding hooves would show
const grid = new THREE.GridHelper(120, 120, 0x6b5a44, 0x857055); grid.position.y = 0.005; scene.add(grid);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 6, 22);
const orbit = new OrbitControls(camera, R.domElement); orbit.target.set(0, 1.2, 0);
const W = { heightAt: () => 0, blocked: () => false, waterAt: () => 0, scene };

const [folk, animals] = await Promise.all([loadFolk('../'), loadAnimals('../', { kinds: ['horse', 'horseWhite'] })]);
const kit = await loadRiderKit({ animals, base: '../' });
const N = +(Q.get('n') || 4), riders = [];
let speed = +(Q.get('speed') || 3), frozen = false;
for (let i = 0; i < N; i++) {
  const r = makeRider(kit, { W, folk, scene });
  r.setNumber(String([24, 27, 36, 42, 30, 18][i % 6]));
  r.angle = (i / N) * Math.PI * 2; r.radius = 9 + (i % 2) * 2.5;
  r.place(Math.sin(r.angle) * r.radius, Math.cos(r.angle) * r.radius, r.angle + Math.PI / 2);
  riders.push(r);
}
RIDE.riders = riders;
const bar = document.getElementById('bar');
const add = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; bar.appendChild(b); };
for (const v of [0, 2.2, 3.5, 6, 10]) add(`${v} m/s`, () => { speed = v; });
add('tip a hat', () => RIDE.tip(0));
add('rope one', () => RIDE.fall(1));
add('freeze', () => { frozen = !frozen; });
RIDE.speed = (v) => { speed = v; };
RIDE.tip = (i) => riders[i].tipHat();
RIDE.fall = (i, at = { x: 0, z: 0 }) => riders[i].fall(at);
RIDE.freeze = (on) => { frozen = on; };
const VIEWS = {
  side: () => { const r = riders[0]; camera.position.set(r.x + Math.cos(r.heading) * 6, 1.6, r.z - Math.sin(r.heading) * 6); orbit.target.set(r.x, 1.3, r.z); },
  rside: () => { const r = riders[0]; camera.position.set(r.x - Math.cos(r.heading) * 4 + Math.sin(r.heading) * 2.5, 2.2, r.z + Math.sin(r.heading) * 4 + Math.cos(r.heading) * 2.5); orbit.target.set(r.x, 2.1, r.z); },
  chase: () => { const r = riders[0]; camera.position.set(r.x - Math.sin(r.heading) * 8, 3.2, r.z - Math.cos(r.heading) * 8); orbit.target.set(r.x, 1.6, r.z); },
  low: () => { const r = riders[0]; camera.position.set(r.x + Math.cos(r.heading) * 3, 0.35, r.z - Math.sin(r.heading) * 3); orbit.target.set(r.x, 0.3, r.z); },
  top: () => { camera.position.set(0, 30, 0.1); orbit.target.set(0, 0, 0); },
  down: () => { const r = riders[1]; const p = r.person.root.position; camera.position.set(p.x + 2.2, 1.6, p.z + 2.2); orbit.target.set(p.x, 0.3, p.z); },
  far: () => { const r = riders[0]; camera.position.set(r.x + 30, 4, r.z + 10); orbit.target.set(r.x, 1.6, r.z); },
};
let view = Q.get('view');
RIDE.view = (v) => { view = v; };
// a fixed look for rigs: the camera at (x, y, z) looking at (tx, ty, tz)
RIDE.look = (x, y, z, tx, ty, tz) => { view = null; camera.position.set(x, y, z); orbit.target.set(tx, ty, tz); orbit.update(); };
// hooves on the ground: rider 0 rides straight on at v m/s (steps of 1/60 s, not real time); each hoof is the lowest
// corner of the horse's mesh in its own quarter; while a hoof is down (within 3 cm of its lowest) it should not move.
// -> { v, clip, clipSpeed, slide: the hooves' mean speed while down (m/s), worst }
RIDE.hoofTest = (v, seconds = 3, { k = 1, band = 0.03 } = {}) => {
  frozen = true;
  const r = riders[0];
  const play0 = r.horse.play; r.horse.play = (name, o = {}) => play0(name, { ...o, speed: (o.speed ?? 1) * k });
  const m = r.horse.mesh, g = m.geometry, pos = g.attributes.position;
  r.place(0, 0, 0); r.speed = v;
  // the four hooves: in the bind pose, the lowest corner in each quarter (front/back, left/right)
  const hooves = [null, null, null, null], tmp = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    tmp.fromBufferAttribute(pos, i);
    const q = (tmp.z > 0 ? 2 : 0) + (tmp.x > 0 ? 1 : 0);
    if (!hooves[q] || tmp.y < hooves[q].y) hooves[q] = { i, y: tmp.y };
  }
  const step = (dt) => { r.steer(0, r.z + 50, v, dt); r.update(dt); };
  for (let k = 0; k < 90; k++) step(1 / 60);
  const tracks = hooves.map(() => []);
  for (let k = 0; k < seconds * 60; k++) {
    step(1 / 60); r.horse.root.updateMatrixWorld(true);
    hooves.forEach((h, j) => { const w = m.getVertexPosition(h.i, new THREE.Vector3()); m.localToWorld(w); tracks[j].push(w); });
  }
  let sum = 0, n = 0, worst = 0;
  for (const t of tracks) {
    const lo = Math.min(...t.map((w) => w.y));
    for (let k = 1; k < t.length; k++) if (t[k].y < lo + band && t[k - 1].y < lo + band) {
      const sp = Math.hypot(t[k].x - t[k - 1].x, t[k].z - t[k - 1].z) * 60; sum += sp; n++; worst = Math.max(worst, sp);
    }
  }
  frozen = false; r.horse.play = play0;
  return { v, k, speed: +r.speed.toFixed(2), clip: r.horse.clip, slide: +(sum / Math.max(1, n)).toFixed(3), worst: +worst.toFixed(2), samples: n };
};
// a row of people standing (or face down) with one bone turned, to learn which way each bone's axes go:
// RIDE.lab([{ bone: 'UpperArmL', e: [x, y, z] }, ...], { prone }) -> places them along x, camera from the side
const lab = [];
RIDE.lab = (list, { prone = false, side = false } = {}) => {
  for (const o of lab.splice(0)) o.dispose();
  for (const r of riders) { r.person.root.visible = false; r.horse.root.visible = false; r.label.visible = false; }
  frozen = true;
  list.forEach((spec, i) => {
    const p = makePerson(folk, { outfit: spec.outfit || 'casual_m', palette: 'rancher' });
    scene.add(p.root); p.root.position.set((i - (list.length - 1) / 2) * 1.6, prone ? 0.16 : 0, 0);
    if (prone) p.root.rotation.set(Math.PI / 2, Math.PI / 2, 0, 'YXZ'); else if (side === 'back') p.root.rotation.y = Math.PI; else if (side) p.root.rotation.y = -Math.PI / 2;
    p.play('Idle', { fade: 0 }); p.update(0.01);
    const q = new THREE.Quaternion();
    for (const [bone, e] of Object.entries(spec)) if (p.bones[bone]) p.bones[bone].quaternion.multiply(q.setFromEuler(new THREE.Euler(...e)));
    if (spec.tie) tiePose(p, 1, { ...TIE, ...spec.tie });
    lab.push(p);
  });
  camera.position.set(0, prone ? 3.5 : 1.4, prone ? 5 : 7); orbit.target.set(0, prone ? 0.2 : 1, 0); view = null;
};
const info = document.getElementById('info');
const camFwd = new THREE.Vector3(), lp = new THREE.Vector3();
let last = performance.now();
R.setAnimationLoop(() => {
  const now = performance.now(), dt = frozen ? 0 : Math.min(0.05, (now - last) / 1000); last = now;
  if (lab.length) { orbit.update(); R.render(scene, camera); RIDE.ready = true; return; }
  for (const r of riders) {
    if (r.mode === 'ride') {
      r.angle += (speed / r.radius) * dt;
      r.steer(Math.sin(r.angle + 0.25) * r.radius, Math.cos(r.angle + 0.25) * r.radius, speed, dt);
    }
    r.update(dt);
    // the card: about 56 px tall on screen
    const L = r.label; L.visible = r.mode === 'ride' && !!r.number;
    if (L.visible) {
      lp.set(r.x, r.top(), r.z); L.position.copy(lp);
      camera.getWorldDirection(camFwd);
      const depth = Math.max(0.5, lp.sub(camera.position).dot(camFwd)), px = 56, h = innerHeight;
      const hw = px * 2 * depth / (camera.projectionMatrix.elements[5] * h);
      L.scale.set(hw * RIDERS.card[0] / RIDERS.card[1], hw, 1);
    }
  }
  if (view && VIEWS[view]) VIEWS[view]();
  orbit.update();
  R.render(scene, camera);
  info.textContent = riders.map((r, i) => `${i} ${r.mode} ${r.horse.clip} ${r.speed.toFixed(2)} m/s`).join('\n');
  RIDE.ready = true;
});
addEventListener('resize', () => { R.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
</script>
</body>
</html>
