<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandit Math: flat or smooth shading</title>
<script src="../oops.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #e8e0d0; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; top: 10px; left: 12px; z-index: 5; font: 12px/1.5 ui-monospace, monospace; text-shadow: 0 1px 3px #000; pointer-events: none; white-space: pre; }
  #bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5; display: flex; flex-direction: column; gap: 6px; align-items: center; max-width: calc(100vw - 24px); }
  .row { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; background: rgba(28, 20, 12, .72); border-radius: 6px; padding: 5px; }
  .row b { font: 600 11px ui-monospace, monospace; color: #b99a6a; align-self: center; padding: 0 6px; }
  .row button { font: 600 12px ui-monospace, monospace; background: rgba(40, 28, 16, .85); color: #f0d9a8; border: 1px solid #7a5a3a; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  .row button.on { background: #c9a25a; color: #23170c; border-color: #f0d9a8; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; background: #1c140c; font: 600 15px ui-monospace, monospace; color: #f0d9a8; }
  #sheet { position: fixed; inset: 0; z-index: 8; background: rgba(12, 9, 6, .94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; }
  #sheet[hidden] { display: none; }
  #sheet img { max-width: 100%; max-height: calc(100% - 60px); object-fit: contain; border: 1px solid #7a5a3a; }
  #sheet .row a { font: 600 12px ui-monospace, monospace; color: #f0d9a8; padding: 6px 10px; }
  body.shot #bar, body.shot #hud, body.shot #hide { display: none; }
  body.bare #bar { display: none; }
  @media (max-width: 600px) { #hud { top: 48px; font-size: 10px; } }
  #hide { position: fixed; top: 10px; right: 12px; z-index: 6; font: 600 12px ui-monospace, monospace; background: rgba(40, 28, 16, .85); color: #f0d9a8; border: 1px solid #7a5a3a; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<div id="load">Loading…</div>
<div id="hud"></div>
<button id="hide">Hide buttons</button>
<div id="bar">
  <div class="row" id="styles"><b>LOOK</b></div>
  <div class="row" id="views"><b>VIEW</b></div>
  <div class="row" id="poses"><b>POSE</b></div>
</div>
<div id="sheet" hidden><img alt="the looks side by side"><div class="row"><a download="shading.png">Save picture</a><button id="sheetClose">Close</button></div></div>
<script type="module">
// FLAT OR SMOOTH: how the low-poly animals and people (Quaternius' packs: flat faces, every facet lit as one) would look
// with smoother shading, beside the Tripo models (the buildings and the saddle, which are smooth and textured). They
// stand a few metres in front of one of the town's buildings in the valley's own light, with a saddled horse. The switch changes
// only the normals (the direction each corner of a face is taken to point, which is all the lighting reads):
//   Flat          the files as they are: each face lit as one flat plane
//   Creased 30/45/75   smooth across an edge where the faces meet at less than 30 (45, 75) degrees, a hard edge where
//                 they bend more (Blender's "auto smooth"). 75 smooths the bodies almost as much as Smooth but keeps the
//                 sharp folds sharp: the hooves' soles, the hat brims, the cuffs
//   Smooth        every corner shared by faces of the same colour gets one averaged direction (the edges between two
//                 colours stay hard, since those corners are kept apart by their colours)
// The bones, the clips and the colours are untouched: only the shapes' copies with new normals are swapped in.
//   ?look=flat|crease30|crease45|crease75|smooth   start with that look;  ?view=rider|people|faces|horse|cow|hooves|backlit   ?at=cabin|stable|store|
//   sheriff   the building behind them;  ?pose=stand|walk;  ?play  the clips running;  ?shot  no buttons;
//   ?saddle=basic|battle|fancy;  ?stock  also offers three.js' toCreasedNormals as it comes (see creased() below);
//   ?crease=60,90  more crease angles to try
// Keys: 1-5 the looks, Space play / hold still, S the side-by-side sheet, B hide the buttons. Drag to look round, wheel to zoom.
// For rigs: window.SH = { ready, errors, W, camera, renderer, actors, look(name), view(name), pose(name, t), playing,
//   sheet({ looks, cols, labels, caption }) -> a PNG data URL of the looks side by side from this camera, stats }
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { toCreasedNormals, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { makeWorld } from '../src/world.js';
import { loadFolk, makePerson } from '../src/actors/folk.js';
import { loadAnimals, makeAnimal, saddleOn } from '../src/actors/animals.js';

const Q = new URLSearchParams(location.search);
if (Q.has('shot')) document.body.classList.add('shot');
const $ = (id) => document.getElementById(id);
const SH = window.SH = { ready: false, errors: [], playing: Q.has('play'), stats: {} };
addEventListener('error', (e) => SH.errors.push(String(e.message)));

// ── THE LOOKS ─────────────────────────────────────────────────────────────────────────────────────────────────
const LOOKS = { flat: 'Flat (as now)', crease30: 'Creased 30°', crease45: 'Creased 45°', crease75: 'Creased 75°', smooth: 'Smooth' };
const MAIN = Object.keys(LOOKS);                      // (the side-by-side sheet shows these)
if (Q.has('stock')) LOOKS.stock30 = 'Creased 30° (three.js as it comes)';
// ?crease=60,90: more crease angles to try (any whole number of degrees)
for (const a of (Q.get('crease') || '').split(',').map(Number).filter((a) => a > 0 && a < 180)) LOOKS['crease' + a] = `Creased ${a}°`;

// Creased: three.js' toCreasedNormals, which works on a copy where every triangle has corners of its own, finds the
// corners that sit on the same spot and averages the faces' directions there, leaving out any face bent more than the
// angle away. It finds "the same spot" on a grid of 1/100 of the model's own unit. These files are packed into -1..1 (a
// horse or a person is 2 units from end to end), so that grid is about a centimetre: details a few millimetres apart (an
// eye, a nostril, a finger, a hoof's rim) would be lumped together and lit wrongly. So it runs on a stand-in blown up
// until the grid is a millionth of the model's size, and only its answer, the normals, is kept. (`stock`: as it comes.)
function creased(geo, degrees, stock = false) {
  const tri = geo.index ? geo.toNonIndexed() : geo.clone();
  const p = tri.attributes.position, stand = new THREE.BufferGeometry();
  if (!tri.boundingBox) tri.computeBoundingBox();
  const k = stock ? 1 : 2e4 / Math.max(1e-6, tri.boundingBox.getSize(new THREE.Vector3()).length());
  const big = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) { big[i * 3] = p.getX(i) * k; big[i * 3 + 1] = p.getY(i) * k; big[i * 3 + 2] = p.getZ(i) * k; }
  stand.setAttribute('position', new THREE.BufferAttribute(big, 3));
  const n = toCreasedNormals(stand, degrees * Math.PI / 180).attributes.normal;
  // a corner of a sliver too thin to have a direction of its own keeps the file's (else it would draw black)
  let kept = 0; const old = geo.attributes.normal ? tri.attributes.normal : null;
  for (let i = 0; i < n.count; i++) if (Math.hypot(n.getX(i), n.getY(i), n.getZ(i)) < 0.5) { kept++; if (old) n.setXYZ(i, old.getX(i), old.getY(i), old.getZ(i)); else n.setXYZ(i, 0, 1, 0); }
  tri.setAttribute('normal', n);
  const out = mergeVertices(tri);                     // corners that now agree in everything are shared again: fewer to bend with the bones
  out.userData.keptNormals = kept;
  return out;
}
// Smooth: the normals dropped, the corners that agree in everything else (spot, colour, bones) merged, and each merged
// corner given the average of its faces
function smooth(geo) {
  const g = geo.clone(); g.deleteAttribute('normal');
  const out = mergeVertices(g); out.computeVertexNormals();
  return out;
}
const MAKE = { smooth, stock30: (g) => creased(g, 30, true) };
for (const k of Object.keys(LOOKS)) { const m = /^crease(\d+)$/.exec(k); if (m) MAKE[k] = (g) => creased(g, +m[1]); }
const made = new Map();                               // the file's shape -> { look: its copy for that look }
function shapeFor(base, look) {
  if (look === 'flat') return base;
  let m = made.get(base); if (!m) made.set(base, (m = {}));
  return m[look] || (m[look] = MAKE[look](base));
}
const restyled = [];                                  // { mesh, base, name }: every mesh that changes with the look
let lookNow = 'flat';
function look(name) {
  if (!LOOKS[name]) return false;
  for (const r of restyled) r.mesh.geometry = shapeFor(r.base, name);
  lookNow = name; for (const b of document.querySelectorAll('#styles button')) b.classList.toggle('on', b.dataset.k === name);
  return true;
}

// how the stock grid would lump this shape: distinct spots in the file vs distinct centimetre-grid cells
function lumps(geo) {
  const p = geo.attributes.position, exact = new Set(), grid = new Set();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    exact.add(`${Math.round(x * 1e6)},${Math.round(y * 1e6)},${Math.round(z * 1e6)}`);
    grid.add(`${~~(x * 100)},${~~(y * 100)},${~~(z * 100)}`);
  }
  return { spots: exact.size, gridCells: grid.size, lumped: exact.size - grid.size };
}

// ── THE WORLD AND THE CAST ───────────────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: Q.get('q') !== 'potato', powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 5000);
const saddleFile = ['basic', 'battle', 'fancy'].includes(Q.get('saddle')) ? Q.get('saddle') : 'basic';
const [W, folk, animals, saddle] = await Promise.all([
  makeWorld({ renderer, camera, quality: Q.get('q') || undefined, look: Q.get('world') || 'green', onProgress: (p, text) => { $('load').textContent = `${text}… ${Math.round(p * 100)}%`; } }),
  loadFolk(),
  loadAnimals(undefined, { kinds: ['horse', 'cow'] }),
  new GLTFLoader().loadAsync('../models/saddles/' + saddleFile + '.glb').then((g) => g.scene),
]);
$('load').remove();
const controls = new OrbitControls(camera, renderer.domElement); controls.target = W.camTarget; controls.enableDamping = true;

// the stage: a few metres out from the building's front, the cast in a row along it, facing out
const B = W.places[Q.get('at')] || W.places.cabin;                     // (the cabin: lit from the side at the game's time of day)
const F = new THREE.Vector3(Math.sin(B.rot), 0, Math.cos(B.rot));            // the way the building's front faces
const R = new THREE.Vector3(Math.cos(B.rot), 0, -Math.sin(B.rot));           // along the front
const stage = new THREE.Vector3(B.door.x, 0, B.door.z).addScaledVector(F, 3.0);
const spot = (along, out = 0) => { const v = stage.clone().addScaledVector(R, along).addScaledVector(F, out); v.y = W.heightAt(v.x, v.z); return v; };
const faceOut = B.rot, faceAlong = Math.atan2(R.x, R.z);
const actors = SH.actors = {};
function place(a, at, rot) { a.root.position.copy(at); a.root.rotation.y = rot; W.scene.add(a.root); }
actors.horse = makeAnimal(animals, 'horse'); place(actors.horse, spot(-3.6, -0.4), faceAlong - 0.25);
saddleOn(actors.horse, saddle.clone());
actors.farmer = makePerson(folk, { outfit: 'farmer_m', palette: 'drifter', skin: 3, hair: 2 }); place(actors.farmer, spot(-0.7, 0.6), faceOut + 0.3);
actors.settler = makePerson(folk, { outfit: 'casual_f', palette: 'prairie', skin: 1, hair: '#2b1d14' }); place(actors.settler, spot(0.5, 0.6), faceOut - 0.3);
actors.cow = makeAnimal(animals, 'cow'); { const d = F.clone().multiplyScalar(0.9).sub(R); place(actors.cow, spot(3.4, -0.2), Math.atan2(d.x, d.z)); }
for (const [name, a] of Object.entries(actors)) a.root.traverse((o) => {
  if (!o.isMesh || !o.geometry.attributes.normal) return;
  if (a.saddle && isUnder(o, a.saddle)) return;                     // (the saddle is Tripo's: left as it is)
  restyled.push({ mesh: o, base: o.geometry, name: name + (o.isSkinnedMesh ? '' : ' (' + (o.parent && o.parent.name || o.name || 'part') + ')') });
});
function isUnder(o, top) { for (let p = o; p; p = p.parent) if (p === top) return true; return false; }

// the poses: every clip stopped and the chosen one started from t seconds in, so each look is drawn in the same pose
const POSES = { stand: { horse: 'Idle', cow: 'Idle', farmer: 'Idle', settler: 'Idle' }, walk: { horse: 'Walk', cow: 'Walk', farmer: 'Walk', settler: 'Walk' } };
let poseNow = 'stand';
function pose(name = poseNow, t = 0.6) {
  const P = POSES[name]; if (!P) return false;
  for (const [who, a] of Object.entries(actors)) {
    const mixer = a.mixer || a.person.mixer, acts = a.actions || a.person.actions, act = acts[P[who]];
    mixer.stopAllAction(); if (!act) continue;
    act.reset(); act.setLoop(THREE.LoopRepeat, Infinity); act.setEffectiveTimeScale(1).setEffectiveWeight(1).play();
    mixer.update(t);
  }
  poseNow = name; for (const b of document.querySelectorAll('#poses button[data-k]')) b.classList.toggle('on', b.dataset.k === name);
  return true;
}
function setPlaying(on) { SH.playing = !!on; const b = $('playBtn'); if (b) { b.textContent = SH.playing ? 'Hold still' : 'Play'; b.classList.toggle('on', SH.playing); } }

// ── THE VIEWS ─────────────────────────────────────────────────────────────────────────────────────────────────
// rider: as far as the game's camera sits behind a rider (9 m, looking down a little); the rest close up
const headOf = (p) => p.bones.Head.getWorldPosition(new THREE.Vector3());
const VIEWS = {
  rider: () => ({ at: spot(-0.4, 9).add(new THREE.Vector3(0, 4.6, 0)), look: spot(-0.4, 0).add(new THREE.Vector3(0, 1.2, 0)) }),
  people: () => { const m = spot(-0.1, 0.6); return { at: m.clone().addScaledVector(F, 3.0).add(new THREE.Vector3(0, 1.75, 0)), look: m.clone().add(new THREE.Vector3(0, 1.2, 0)) }; },
  faces: () => { const a = headOf(actors.farmer), b = headOf(actors.settler), m = a.clone().add(b).multiplyScalar(0.5); return { at: m.clone().addScaledVector(F, 1.55).add(new THREE.Vector3(0, 0.1, 0)), look: m.clone().add(new THREE.Vector3(0, -0.02, 0)) }; },
  horse: () => { const h = actors.horse.root.position; return { at: h.clone().addScaledVector(F, 3.6).add(new THREE.Vector3(0, 1.5, 0)), look: h.clone().add(new THREE.Vector3(0, 1.0, 0)) }; },
  cow: () => { const c = actors.cow.root.position; return { at: c.clone().addScaledVector(F, 2.9).add(new THREE.Vector3(0, 1.2, 0)), look: c.clone().add(new THREE.Vector3(0, 0.75, 0)) }; },
  // the hooves and lower legs of the horse, low down
  hooves: () => { const h = actors.horse.root, f = new THREE.Vector3(Math.sin(h.rotation.y), 0, Math.cos(h.rotation.y)), m = h.position.clone().addScaledVector(f, 0.35);
    return { at: m.clone().addScaledVector(F, 1.9).add(new THREE.Vector3(0, 0.55, 0)), look: m.clone().add(new THREE.Vector3(0, 0.3, 0)) }; },
  // against the light: from the far side of the cast from the sun, so their shaded sides face the camera
  backlit: () => { const s = W.V.SUN_NOW, sh = new THREE.Vector3(s.x, 0, s.z).normalize(), m = spot(-1.2, 0.3);
    return { at: m.clone().addScaledVector(sh, -5.5).add(new THREE.Vector3(0, 1.9, 0)), look: m.clone().add(new THREE.Vector3(0, 1.0, 0)) }; },
};
const VIEW_NAMES = { rider: 'Rider distance (9 m)', people: 'Close: people', faces: 'Close: faces', horse: 'Close: horse', cow: 'Close: cow', hooves: 'Close: hooves', backlit: 'Against the light' };
let viewNow = 'rider';
function view(name) {
  if (!VIEWS[name]) return false;
  W.scene.updateMatrixWorld(true);
  const v = VIEWS[name](); camera.position.copy(v.at); W.camTarget.copy(v.look); camera.lookAt(v.look); controls.update();
  viewNow = name; for (const b of document.querySelectorAll('#views button')) b.classList.toggle('on', b.dataset.k === name);
  return true;
}

// ── THE SHEET: the looks side by side, from this camera, in this pose ──────────────────────────────────────────
function sheet({ looks = MAIN, cols = looks.length > 4 ? 3 : looks.length > 1 ? 2 : 1, labels = true, caption = true } = {}) {
  const cv = renderer.domElement, w = cv.width, h = cv.height, rows = Math.ceil(looks.length / cols), gap = 4;
  const out = document.createElement('canvas'); out.width = cols * w + (cols - 1) * gap; out.height = rows * h + (rows - 1) * gap;
  const c = out.getContext('2d'); c.fillStyle = '#120d08'; c.fillRect(0, 0, out.width, out.height);
  const was = lookNow;
  looks.forEach((name, i) => {
    look(name); W.update(0); W.render();
    const x = (i % cols) * (w + gap), y = Math.floor(i / cols) * (h + gap);
    c.drawImage(cv, x, y);                           // (straight after the draw, before the browser clears it)
    if (labels) {
      const fs = Math.round(h / 24); c.font = `700 ${fs}px ui-sans-serif, system-ui, sans-serif`;
      const tw = c.measureText(LOOKS[name]).width; c.fillStyle = 'rgba(20, 14, 8, .78)'; c.fillRect(x + 10, y + 10, tw + fs, fs * 1.6);
      c.fillStyle = '#f3e3c0'; c.textBaseline = 'middle'; c.fillText(LOOKS[name], x + 10 + fs / 2, y + 10 + fs * 0.8);
    }
  });
  // a spare cell at the end: what this sheet shows
  if (caption && looks.length < rows * cols) {
    const i = looks.length, x = (i % cols) * (w + gap), y = Math.floor(i / cols) * (h + gap), fs = Math.round(h / 22);
    c.fillStyle = '#f3e3c0'; c.font = `700 ${fs}px ui-sans-serif, system-ui, sans-serif`; c.textBaseline = 'top';
    const text = [VIEW_NAMES[viewNow] || viewNow, poseNow === 'walk' ? 'walking' : 'standing', `in front of the ${B.kind === 'generalStore' ? 'general store' : B.kind}`, 'one camera, one pose'];
    text.forEach((t, j) => c.fillText(t, x + fs, y + fs + j * fs * 1.5));
  }
  look(was);
  return out.toDataURL('image/png');
}
function showSheet() {
  const url = sheet(); $('sheet').querySelector('img').src = url; const a = $('sheet').querySelector('a'); a.href = url; a.download = `shading-${viewNow}-${poseNow}.png`;
  $('sheet').hidden = false;
}
$('sheetClose').onclick = () => { $('sheet').hidden = true; };
function toggleBar() { const bare = document.body.classList.toggle('bare'); $('hide').textContent = bare ? 'Show buttons' : 'Hide buttons'; }
$('hide').onclick = toggleBar;

// ── THE BUTTONS, KEYS AND HUD ────────────────────────────────────────────────────────────────────────────────
const button = (row, text, k, fn) => { const b = document.createElement('button'); b.textContent = text; if (k) b.dataset.k = k; b.onclick = fn; $(row).appendChild(b); return b; };
for (const [k, text] of Object.entries(LOOKS)) button('styles', text, k, () => look(k));
for (const k of Object.keys(VIEWS)) button('views', VIEW_NAMES[k] || k, k, () => view(k));
button('poses', 'Standing', 'stand', () => pose('stand')); button('poses', 'Walking', 'walk', () => pose('walk'));
button('poses', 'Play', null, () => setPlaying(!SH.playing)).id = 'playBtn';
button('poses', 'Side by side', null, showSheet);
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const n = '12345'.indexOf(e.key); if (n >= 0) look(Object.keys(LOOKS)[n]);
  if (e.code === 'Space') { setPlaying(!SH.playing); e.preventDefault(); }
  if (e.key === 's' || e.key === 'S') showSheet();
  if (e.key === 'b' || e.key === 'B') toggleBar();
  if (e.key === 'Escape') $('sheet').hidden = true;
});

// the numbers for the record: each shape's corners before and after, and what the stock grid would lump
for (const r of restyled) {
  const s = SH.stats[r.name] = { corners: { flat: r.base.attributes.position.count }, ...lumps(r.base) };
  s.ms = {};
  for (const k of Object.keys(MAKE)) if (LOOKS[k]) { const t = performance.now(), g = shapeFor(r.base, k); s.ms[k] = Math.round(performance.now() - t); s.corners[k] = g.attributes.position.count; if (g.userData.keptNormals) s['kept_' + k] = g.userData.keptNormals; }
  s.attributes = Object.keys(shapeFor(r.base, 'smooth').attributes).join(' ');
}

look(LOOKS[Q.get('look')] ? Q.get('look') : 'flat');
pose(POSES[Q.get('pose')] ? Q.get('pose') : 'stand');
view(VIEWS[Q.get('view')] ? Q.get('view') : 'rider');
setPlaying(SH.playing);

let frames = 0, fpsNow = 0, last = performance.now(), tFps = last;
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (SH.playing) for (const a of Object.values(actors)) a.update(dt);
  controls.update(); W.update(dt); W.render();
  frames++; if (now - tFps > 1000) { fpsNow = frames * 1000 / (now - tFps); frames = 0; tFps = now;
    const lines = [`${W.tier} · ${fpsNow.toFixed(0)} fps · ${renderer.info.render.calls} draws`, `look: ${LOOKS[lookNow]} · pose: ${poseNow}${SH.playing ? ' (playing)' : ''}`];
    for (const [name, s] of Object.entries(SH.stats)) lines.push(`${name}: ${s.corners.flat} corners as made, ${s.corners[lookNow] ?? s.corners.flat} now`);
    $('hud').textContent = lines.join('\n'); }
});
Object.assign(SH, { W, camera, renderer, controls, look, view, pose, sheet, setPlaying, LOOKS, VIEWS, restyled });
Object.defineProperty(SH, 'lookNow', { get: () => lookNow });
SH.ready = true;
</script>
</body>
</html>
