<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bandit Math: title screen test</title>
<script src="../oops.js"></script>
<style>
  /* Stand-in for the live valley: a dusk sky over dark hills (the real game shows the 3D valley here). */
  html, body { margin: 0; height: 100%; background: #1b140f; overflow: hidden; }
  #sky { position: fixed; inset: 0; background: linear-gradient(180deg, #2c3d52 0%, #6f6a6a 38%, #c0875a 58%, #4a3826 72%, #1c150f 100%); }
  #sky svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 55%; }
  body.bright #sky { background: linear-gradient(180deg, #8fb5d9 0%, #cfe0ea 45%, #d8cfae 58%, #7f8f52 70%, #55663a 100%); }
  body.bright #sky svg path { opacity: 0.5; }
  body.photo #sky { background: #222 center / cover no-repeat var(--photo); }
  body.photo #sky svg { display: none; }
  #log { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 50; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: #ffe9b8; background: rgba(0, 0, 0, 0.55); padding: 4px 10px; border-radius: 6px; pointer-events: none; max-width: 70vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log:empty { display: none; }
</style>
</head>
<body>
<div id="sky"><svg viewBox="0 0 1600 500" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 210 C180 120 320 160 470 110 C620 60 760 140 900 120 C1080 95 1200 30 1350 70 C1460 100 1540 90 1600 80 V500 H0Z" fill="#3b3a3c" opacity="0.8"/>
  <path d="M0 300 C200 240 360 270 520 230 C700 190 860 260 1020 240 C1200 215 1380 170 1600 200 V500 H0Z" fill="#2e3326"/>
  <path d="M0 380 C240 340 460 370 700 350 C960 330 1220 380 1600 340 V500 H0Z" fill="#20241a"/>
</svg></div>
<div id="title-root"></div>
<div id="log"></div>
<script type="module">
// Test page for the title screen alone, with a fake world loading behind it.
//   ?riders=demo     three made-up riders (default: whatever this test page saved last time)
//   ?riders=none     start with no riders (the new-rider form)
//   ?riders=many     the most riders a device holds, with the longest names allowed
//   ?blocked         pretend the browser blocks storage
//   ?progress=slow|fast|none|done    how the fake world loads (default fast: about 5 s)
//   ?bg=bright       a bright daytime stand-in instead of dusk; ?bg=photo&img=<url> any picture
// Riders here are saved under their own key, so this page never touches real riders.
try {
  const q = new URLSearchParams(location.search);
  if (q.has('blocked')) {
    Object.defineProperty(window, 'localStorage', { configurable: true, get() { throw new DOMException('blocked', 'SecurityError'); } });
  }
  if (q.get('bg') === 'bright') document.body.classList.add('bright');
  if (q.get('bg') === 'photo' && q.get('img')) { document.body.classList.add('photo'); document.body.style.setProperty('--photo', `url("${q.get('img')}")`); }

  const save = await import('../src/save.js');
  const skill = await import('../src/math/skill.js');
  const { showTitle } = await import('../src/ui/title.js');
  // Days of play for a demo rider: each day a few answers per strand near the level, about 4 in 5 right (sit-down
  // strands timed), so the panel and the stats page have levels, history lines and times to show.
  const DAY = 864e5;
  function played(r, plan, days = 12) {
    let seed = 7;
    const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (const [strand, start, sit] of plan) skill.setLevel(r, strand, start, { placed: true, now: Date.now() - days * DAY });
    for (let d = days; d >= 0; d--) {
      if (d % 3 === 1) continue;   // (not every day)
      for (const [strand, , sit, skill_] of plan) {
        for (let k = 0; k < 8; k++) {
          const lvl = skill.levelOf(r, strand), right = rand() < (skill_ || 0.82);
          skill.record(r, strand, { right, at: lvl, sitDown: !!sit, ms: sit ? 2500 + rand() * 6000 : undefined, size: 1, now: Date.now() - d * DAY - (8 - k) * 60e3 });
        }
      }
    }
  }
  save.useSaveKey('bandit-math.riders.test');

  if (q.get('riders') === 'none' || q.get('riders') === 'demo' || q.get('riders') === 'many') {
    try { localStorage.removeItem('bandit-math.riders.test'); } catch (e) { /* blocked */ }
  }
  if (q.get('riders') === 'demo') {
    const day = 864e5, now = Date.now();
    const a = save.newRider('Wyatt', { outfit: 'farmer_m', palette: 'drifter', skin: '#e0ac85', hair: '#4a2e1a' });
    a.bounty = 742; a.gold = 37; a.last = now - 3600e3; a.made = now - 9 * day;
    a.topics.times = { step: 7 }; a.topics.algebra = { rung: 3 };
    a.stats = { ...a.stats, answered: 212, right: 196, recent: Array.from({ length: 50 }, (_, i) => (i % 13 ? 1 : 0)),
      byMode: { lasso: { answered: 212, right: 196, recent: Array.from({ length: 50 }, (_, i) => (i % 13 ? 1 : 0)) }, shoot: { answered: 0, right: 0, recent: [] } },
      boxes: 14, parBoxes: 11 };
    a.badges = ['Top Hand', 'Safecracker'];
    a.lockboxes = [{ tier: 'iron' }, { tier: 'tin' }];
    a.age = 14;
    played(a, [['mul', 30, false, 0.85], ['eq', 50, true, 0.83], ['add', 62, false], ['sub', 56, false, 0.78], ['div', 28, false], ['words', 40, true, 0.86]]);
    skill.pick(a, 'frac');   // (fractions met just now: still finding the level)
    skill.record(a, 'frac', { right: true, sitDown: true, ms: 7000 });
    const b = save.newRider('Clementine', { outfit: 'adventurer_f', palette: 'mustard', skin: '#c68d62', hair: '#2a1a10' });
    b.bounty = 128; b.gold = 52; b.last = now - 2 * day; b.made = now - 6 * day; b.mode = 'shoot';
    b.topics.times = { step: 3 };
    b.stats = { ...b.stats, answered: 41, right: 30, recent: Array.from({ length: 41 }, (_, i) => (i % 4 ? 1 : 0)), boxes: 2, parBoxes: 1 };
    b.age = 9; b.missions.range = false; b.missions.pigs = false;
    played(b, [['add', 14, false], ['number', 12, false]], 3);
    skill.pick(b, 'sub');   // (taking away met just now: still finding)
    skill.record(b, 'sub', { right: true });
    const c = save.newRider('Hob', { outfit: 'adventurer_m', palette: 'sage', skin: '#a96c43', hair: '#3f2a1b' });
    c.bounty = 6400; c.gold = 812; c.last = now - 12 * day; c.made = now - 40 * day;
    [a, b, c].forEach(save.saveRider);
  }

  if (q.get('riders') === 'many') {
    const names = ['Bartholomew Jones', 'Wilhelmina Grace', 'Montgomery Wyatt', 'Annabelle Rosalie', 'Jo', 'Maximilian Stone'];
    names.forEach((n, i) => {
      const L = save.LOOKS[i % save.LOOKS.length];
      const r = save.newRider(n, { outfit: L.outfit, palette: L.palette, skin: save.SKINS[i % 5], hair: save.HAIRS[(i + 2) % 5], hat: i !== 4 });
      r.bounty = [0, 99, 1500, 123456, 6000, 310][i]; r.last = i === 0 ? 0 : Date.now() - i * 864e5 * 3;
      if (i === 3) r.badges = ['Top Hand', 'Sharpshooter', 'Safecracker'];
      save.saveRider(r);
    });
  }

  const log = (s) => { const el = document.getElementById('log'); el.textContent = s; (window.__log = window.__log || []).push(s); };
  const riders = save.loadRiders();
  // a demo rider with two goals pinned (src/completion.js item ids), so the panel shows them
  if (q.get('riders') === 'demo') { const w = riders.find((r) => r.name === 'Wyatt'); if (w && !w.goals) { w.goals = [{ id: 'buckle:boxes:copper', at: Date.now() }, { id: 'buckle:cattle:tin', at: Date.now() }]; save.saveRider(w); } }
  const T = showTitle(document.getElementById('title-root'), {
    riders,
    build: 'test',
    onRide(r) { log(`onRide: ${r.name} (age ${r.age}) jobs off: ${save.MISSIONS.filter((m) => !save.jobOn(r, m.id)).map((m) => m.id).join('+') || 'none'}`); setTimeout(() => T.hide(), 300); setTimeout(() => T.show(), 2600); },
    onLockboxes(r) { log(`onLockboxes: ${r.name}`); },
    onChange(r) { log(`onChange: ${r ? r.name : 'nobody'}`); },
  });
  window.T = T; window.save = save;

  // A pretend world load: steps of work with words, like the real valley gives.
  const mode = q.get('progress') || 'fast';
  const steps = ['Shaping the land', 'Painting the ground', 'Planting trees', 'Laying grass and flowers', 'Raising the town', 'Rounding up the cattle'];
  // window.fakeLoad = false stops the pretend loading, so a rig can set the progress itself
  window.fakeLoad = true;
  if (mode === 'done') T.setProgress(1, 'Ready');
  else if (mode !== 'none') {
    const total = mode === 'slow' ? 30000 : 5000, t0 = performance.now();
    T.setProgress(0, steps[0]);
    const tick = () => {
      if (!window.fakeLoad) return;
      const f = Math.min(1, (performance.now() - t0) / total);
      T.setProgress(f, steps[Math.min(steps.length - 1, Math.floor(f * steps.length))]);
      if (f < 1) setTimeout(tick, 120);
    };
    setTimeout(tick, 120);
  }
  window.ready = true;
} catch (e) { window.oops ? oops(e) : console.error(e); }
</script>
</body>
</html>
