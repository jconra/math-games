<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ship Lab</title>
<meta name="description" content="A space station lab: the ships' outsides, generated from the game's maker's pictures, at true size.">
<!-- the on-screen error box comes first, so a crash shows on screen instead of a blank page -->
<script src="../../../mathwood-valley/oops.js"></script>
<link rel="stylesheet" href="../kit/kit.css?v=1">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c" aria-label="A ship"></canvas>
<div class="kl-top">
  <h1>Ship Lab</h1><a href="../">All labs</a>
  <span class="kl-hud" id="hud" aria-live="polite"></span>
</div>
<!-- ONE MENU: the bar along the bottom (the ships, then the views and what to show) -->
<nav class="kl-bar" id="bar" aria-label="Ship Lab menu">
  <div class="kl-row" id="items" role="listbox" aria-label="Ships"></div>
  <div class="kl-row" id="tabs"></div>
</nav>
<div class="kl-loading" id="loading">Bringing the ship in…</div>
<script type="module" src="main.js?v=1"></script>
</body>
</html>
