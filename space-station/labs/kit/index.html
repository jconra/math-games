<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kit Lab</title>
<meta name="description" content="A space station lab: the station's building pieces one at a time, and test rooms built from them.">
<!-- the on-screen error box comes first, so a crash shows on screen instead of a blank page -->
<script src="../../../mathwood-valley/oops.js"></script>
<link rel="stylesheet" href="kit.css?v=1">
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c" aria-label="A space station piece"></canvas>
<div class="kl-top">
  <h1>Kit Lab</h1><a href="../">All labs</a>
  <span class="kl-hud" id="hud" aria-live="polite"></span>
</div>
<!-- the touch controls: a stick to fly, buttons up and down (only on touch screens) -->
<div class="kl-stick" id="stick" aria-hidden="true"><div class="kl-knob" id="knob"></div></div>
<div class="kl-updown" id="updown" aria-hidden="true"><button id="up" aria-label="Up">▲</button><button id="down" aria-label="Down">▼</button></div>
<!-- ONE MENU: the bar along the bottom (the parts or rooms, then the tabs, variants, views, doors and graphics) -->
<nav class="kl-bar" id="bar" aria-label="Kit Lab menu">
  <div class="kl-row" id="items" role="listbox" aria-label="Pieces"></div>
  <div class="kl-row" id="tabs"></div>
</nav>
<div class="kl-loading" id="loading">Cutting the panels…</div>
<script type="module" src="main.js?v=11"></script>
</body>
</html>
