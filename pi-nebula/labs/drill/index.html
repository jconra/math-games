<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Drill Lab</title>
<meta name="description" content="A space station lab: the drill operator's game by itself. Look round the asteroid field, find a rock by the glow of the ore inside it, fly over, answer its question, turn it in the claw and drill where the ore is thick. Each of the Miner's eight canisters holds one metal: fill all eight, or head home early with what is aboard. Or press Fly manually and fly the Miner up to a rock yourself: the claw takes it. Each new field is come to through the far end of the wormhole.">
<meta name="theme-color" content="#05070b">
<link rel="icon" href="data:,">
<!-- the on-screen error box comes first, so a crash shows on screen instead of a blank page -->
<script src="../../../shared/oops.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #05070b; color: #e8eef5; overflow: hidden; font: 400 15px/1.35 system-ui, "Segoe UI", Roboto, "DejaVu Sans", sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #top { position: fixed; left: 0; right: 0; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: max(6px, env(safe-area-inset-top)) 8px 6px; background: rgba(7, 10, 15, 0.82); border-bottom: 1px solid rgba(79, 182, 255, 0.3); }
  #top h1 { margin: 0 4px 0 0; font: 700 16px/1 system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #9fdcff; }
  #top a { color: #9fdcff; font-size: 13px; margin-right: 4px; }
  #top .rng { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #c9d6e4; }
  #top .rng input { width: 88px; }
  #top:not(.is-sliders) .rng { display: none; }
  #top .rng b { min-width: 30px; color: #9fdcff; }
  #top button, #top select { font: inherit; font-size: 13px; font-weight: 600; height: 32px; padding: 0 10px; color: #e8eef5; background: #152131; border: 1px solid rgba(79, 182, 255, 0.45); border-radius: 6px; }
  #top button[aria-pressed="true"] { background: #1d5f86; border-color: #9fdcff; }
  #top select { max-width: 46vw; }
  #note { flex: 1 1 100%; margin: 0; font-size: 12.5px; color: #a9b8c8; min-height: 1.3em; }
  #loading { position: fixed; inset: 0; z-index: 29; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 18px; color: #cfe6ff; background: #05070b; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c" aria-label="The Miner among the rocks of the asteroid field"></canvas>
<div id="top">
  <h1>Drill Lab</h1><a href="../">All labs</a>
  <button type="button" id="new">New field</button>
  <button type="button" id="ask" aria-pressed="true">Question: on</button>
  <button type="button" id="ore" title="How the ore in the rocks is shown: press to go round the looks">Ore: dots</button>
  <button type="button" id="rock" title="How a rock's own skin is drawn: its flat faces, or a more natural rock">Rock: natural</button>
  <button type="button" id="sliders" aria-pressed="false" title="Show or hide the look's sliders">Sliders</button>
  <label class="rng" title="The soft glow under the ore">Glow <input type="range" id="glow" min="0" max="1.5" step="0.05"><b></b></label>
  <label class="rng" title="How many dots">Dots <input type="range" id="dots" min="0.2" max="2" step="0.05"><b></b></label>
  <label class="rng" title="How big a dot is">Dot size <input type="range" id="size" min="0.5" max="1.5" step="0.05"><b></b></label>
  <label class="rng" title="How hard the light falls on the rocks">Light <input type="range" id="light" min="0.5" max="4" step="0.1"><b></b></label>
  <label class="rng" title="How bright the dust round the field is">Dust <input type="range" id="dust" min="0" max="1" step="0.02"><b></b></label>
  <select id="level" aria-label="The question's level"></select>
  <p id="note" aria-live="polite"></p>
</div>
<div id="loading">Unfolding the arms…</div>
<!-- (the lab is loaded from here so that a mistake in any of its files shows on the page too) -->
<script type="module">import('./main.js?v=32').catch((e) => { window.oops && window.oops(e); const l = document.getElementById('loading'); if (l) l.textContent = 'The lab did not start: ' + (e && e.message || e); });</script>
</body>
</html>
