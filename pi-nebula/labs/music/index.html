<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Lab: the station's music</title>
<meta name="description" content="The station's techno music, made as it plays by the Sound Lab's engine: presets, a choice for each part, the speed, the places to hear it in, its pictures and the hallway's light bars.">
<meta name="theme-color" content="#070a0f">
<link rel="icon" href="data:,">
<script src="../../../shared/oops.js"></script>
<style>
  html, body { margin: 0; min-height: 100%; background: #070a0f; }
  body { padding: 16px; box-sizing: border-box; overflow-x: hidden; color: #a7b0ba;
    font: 400 14px/1.35 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif; }
  .lab { max-width: 1260px; margin: 0 auto; display: grid; gap: 18px; }
  .screens { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; justify-items: center; }
  #screen { width: 100%; max-width: 980px; }
  .wallcol { display: grid; gap: 6px; justify-items: center; align-content: start; }
  #wall { width: 368px; max-width: 100%; }
  .cap { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  @media (min-width: 1200px) { .screens { grid-template-columns: minmax(0, 1fr) 368px; align-items: start; } }
  .lights { display: grid; gap: 8px; }
  .lights canvas { display: block; width: 100%; height: 120px; }
  .styles { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .styles button { font: inherit; font-size: 14px; color: #eef1f4; min-height: 42px; padding: 4px 14px; border: 0; cursor: pointer;
    background: rgba(150, 210, 250, 0.07); box-shadow: inset 0 0 0 1px rgba(150, 210, 250, 0.25); }
  .styles button.is-on { background: rgba(150, 210, 250, 0.2); box-shadow: inset 0 0 0 2px #8fd3ff; color: #fff; }
  @media (max-width: 560px) { body { padding: 8px; } }
</style>
</head>
<body>
<div class="lab">
  <div class="screens">
    <div id="screen"></div>
    <div class="wallcol"><div class="cap">A station wall screen, small</div><div id="wall"></div></div>
  </div>
  <div class="lights">
    <div class="styles"><span class="cap">Hallway light bars</span><span data-styles></span></div>
    <canvas id="lights" aria-label="A row of hallway light bars answering the music"></canvas>
  </div>
</div>
<script type="module" src="main.js?v=9"></script>
</body>
</html>
