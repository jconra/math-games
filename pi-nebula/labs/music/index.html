<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Lab: the station's music</title>
<meta name="description" content="The station's techno music, made as it plays by the Sound Lab's engine: presets, a choice for each part, the speed, the places to hear it in, its pictures and the hallway's lines.">
<meta name="theme-color" content="#070a0f">
<link rel="icon" href="data:,">
<script src="../../../shared/oops.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; min-height: 100%; background: #070a0f; }
  body { padding: 16px; box-sizing: border-box; overflow-x: hidden; color: #a7b0ba;
    font: 400 14px/1.35 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif; }
  .lab { max-width: 980px; margin: 0 auto; display: grid; gap: 14px; }
  #picture { width: 100%; max-width: 980px; margin: 0 auto; }
  #controls { width: 100%; max-width: 980px; margin: 0 auto; }
  .cap { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .lights { display: grid; gap: 8px; }
  .lights canvas { display: block; width: 100%; height: 120px; }
  .styles { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  @media (max-width: 560px) { body { padding: 8px; } }
</style>
</head>
<body>
<div class="lab">
  <div id="picture"></div>
  <div id="controls"></div>
  <div class="lights">
    <div class="styles"><span class="cap">Hallway lines</span></div>
    <canvas id="lights" aria-label="The hallway's five lines answering the music"></canvas>
  </div>
</div>
<script type="module" src="main.js?v=12"></script>
</body>
</html>
